name: Horizon server (build ARM64)

# Serverul Horizon e scris in Rust si e publicat doar pentru x86-64.
# Panelul nostru ruleaza pe ARM64, deci il compilam aici si publicam arhiva
# in release-ul "horizon-arm64", de unde o poate lua panelul.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/horizon-arm64.trigger"

permissions:
  contents: write

jobs:
  build:
    name: Compilez horizon-server pentru aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Clonez sursa Horizon
        run: |
          set +e
          git clone --depth 1 --single-branch https://github.com/horizon-rust/horizon.git horizon-src > clone.log 2>&1
          code=$?
          echo "clone exit=$code" >> clone.log
          tail -5 clone.log
          du -sh horizon-src 2>/dev/null >> clone.log
          exit $code

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: horizon-src

      - name: Build (engine fara sunet + supervisor)
        working-directory: horizon-src
        run: |
          set +e
          df -h . > ../df.txt
          ( cargo build --release --locked -p horizon-client --no-default-features --bin horizon-client ) > ../build-engine.log 2>&1
          echo "engine exit=$?" >> ../build-engine.log
          ( cargo build --release --locked -p horizon-server --bin horizon-server ) > ../build-server.log 2>&1
          echo "server exit=$?" >> ../build-server.log
          ( cargo build --release --locked -p horizon-prepare --bin horizon-prepare ) > ../build-prepare.log 2>&1
          echo "prepare exit=$?" >> ../build-prepare.log
          tail -2 ../build-engine.log ../build-server.log
          exit 0

      - name: Pachetez
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          cp horizon-src/target/release/horizon-client out/horizon-engine
          cp horizon-src/target/release/horizon-server out/horizon-server
          if [ -f horizon-src/target/release/horizon-prepare ]; then cp horizon-src/target/release/horizon-prepare out/; fi
          strip out/* 2>/dev/null || true
          df -h . || true
          ls -lh out
          file out/horizon-server
          tar czf horizon-server-linux-aarch64.tar.gz -C out .
          ls -lh horizon-server-linux-aarch64.tar.gz
          sha256sum horizon-server-linux-aarch64.tar.gz

      - name: Raport in repo (ca sa se vada ce s-a intamplat)
        if: always()
        run: |
          set +e
          mkdir -p horizon
          {
            echo "# ultima incercare de build ARM64"
            echo
            echo '## clone'; tail -20 clone.log 2>/dev/null
            echo; echo '## engine'; tail -40 build-engine.log 2>/dev/null
            echo; echo '## server'; tail -40 build-server.log 2>/dev/null
            echo; echo '## prepare'; tail -10 build-prepare.log 2>/dev/null
            echo; echo '## fisiere'; ls -lh horizon-src/target/release/horizon-server horizon-src/target/release/horizon-client 2>/dev/null
            echo; echo '## pachet'; ls -lh horizon-server-linux-aarch64.tar.gz 2>/dev/null
          } > horizon/_build-report.txt
          git config user.name arena-agent
          git config user.email arena-agent@users.noreply.github.com
          git add -f horizon/_build-report.txt
          git commit -m "raport build Horizon ARM64 [skip ci]" || exit 0
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" >/dev/null 2>&1 || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-server-linux-aarch64
          path: horizon-server-linux-aarch64.tar.gz

      - name: Public in release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=horizon-arm64
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" horizon-server-linux-aarch64.tar.gz --clobber
          else
            gh release create "$TAG" horizon-server-linux-aarch64.tar.gz \
              --title "Horizon server (build ARM64 propriu)" \
              --notes "Compilat din horizon-rust/horizon pe ubuntu-24.04-arm."
          fi
