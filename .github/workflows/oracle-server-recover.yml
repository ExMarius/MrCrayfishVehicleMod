name: Recover migrated Oracle server runtime

on:
  workflow_dispatch:
  push:
    branches:
      - arena/339da537-mrcrayfishvehiclemod
    paths:
      - .github/workflows/oracle-server-recover.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Start the migrated server independently of the Actions job
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/minecraft-server"
          SERVER="$ROOT/mc"
          SESSION=mcv-minecraft

          notice() {
            local value="$1"
            value="${value//'%'/'%25'}"; value="${value//$'\r'/'%0D'}"; value="${value//$'\n'/'%0A'}"
            echo "::notice title=Oracle recovery::$value"
          }

          test -s "$SERVER/server.jar"
          test -f "$SERVER/world/level.dat"
          test -s "$SERVER/plugins/MrCrayfishVehiclePlugin.jar"
          mkdir -p "$ROOT/bin" "$ROOT/logs"

          cat > "$ROOT/bin/start-minecraft.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          SERVER="$ROOT/mc"
          LOGS="$ROOT/logs"
          SESSION=mcv-minecraft
          mkdir -p "$LOGS"
          screen -wipe >/dev/null 2>&1 || true
          if screen -list 2>/dev/null | grep -q "[.]$SESSION[[:space:]]"; then
            echo "Minecraft is already running in screen session $SESSION."
            exit 0
          fi
          env -u RUNNER_TRACKING_ID screen -DmS "$SESSION" bash -lc "cd '$SERVER' && exec java -Xms512M -Xmx2G -XX:+UseG1GC -jar server.jar --nogui >> '$LOGS/server-console.log' 2>&1"
          echo "Started Minecraft in screen session $SESSION."
          SCRIPT

          cat > "$ROOT/bin/start-frp.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          if pgrep -x frpc >/dev/null 2>&1; then
            echo "FRP client is already running."
            exit 0
          fi
          CONFIG="$ROOT/frp/frpc.toml"
          [ -s "$CONFIG" ] || CONFIG="$ROOT/frp/frpc.yaml"
          env -u RUNNER_TRACKING_ID nohup "$ROOT/frp/frpc" -c "$CONFIG" >> "$ROOT/logs/frpc.log" 2>&1 </dev/null &
          echo "Started FRP client."
          SCRIPT
          chmod 700 "$ROOT/bin/"*.sh "$ROOT/start.sh"

          screen -wipe >/dev/null 2>&1 || true
          : > "$ROOT/logs/server-console.log"
          "$ROOT/bin/start-frp.sh"
          "$ROOT/bin/start-minecraft.sh"

          ready=0
          for _ in $(seq 1 120); do
            if grep -Eq 'Done \([0-9.,]+s\)!|Done \(' "$SERVER/logs/latest.log" 2>/dev/null \
                && screen -list 2>/dev/null | grep -q "[.]$SESSION[[:space:]]"; then
              ready=1
              break
            fi
            if ! screen -list 2>/dev/null | grep -q "[.]$SESSION[[:space:]]"; then
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            tail -80 "$ROOT/logs/server-console.log" || true
            echo "::error title=Oracle recovery failed::The migrated server did not stay online"
            exit 1
          fi

          for old in "$ROOT"/.pre-migration-*; do
            [ -d "$old" ] || continue
            env -u RUNNER_TRACKING_ID nohup rm -rf "$old" >> "$ROOT/logs/cleanup.log" 2>&1 </dev/null &
          done
          notice "server-ready session=$SESSION java=$(pgrep -x java | paste -sd, -) frpc=$(pgrep -x frpc | paste -sd, -) disk=$(df -hP "$HOME" | tail -1 | awk '{print $4" free of "$2}')"
