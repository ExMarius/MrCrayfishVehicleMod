name: Backup release (tag backup-release-*)

# Pushed tags matching backup-release-* build the CURRENT plugin JAR + the mandatory
# resource pack on GitHub's runners and publish them as an immutable backup release.
# (The sandbox cannot download CI artifacts - blob storage is off-allowlist - so the
# release is made where the build happens.)

on:
  push:
    tags:
      - "backup-release-*"

permissions:
  contents: write

concurrency:
  group: backup-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test resource-pack build and server synchronization
        run: python3 -m unittest tools.test_build_resource_pack tools.test_configure_server_resource_pack

      - name: Build JAR and mandatory resource pack
        run: ./paper-plugin/gradlew -p paper-plugin clean build resourcePack

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find paper-plugin/build/libs -name 'MrCrayfishVehiclePlugin-*.jar' -type f -print -quit)
          PACK="paper-plugin/build/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r38.zip"
          test -s "$JAR"
          unzip -t "$PACK"
          PACK_SHA1=$(sha1sum "$PACK" | cut -d' ' -f1)
          CONFIG_SHA1=$(sed -n 's/^[[:space:]]*sha1: *"\([0-9a-f]*\)".*/\1/p' paper-plugin/src/main/resources/config.yml)
          test "$PACK_SHA1" = "$CONFIG_SHA1"

      - name: Prepare backup assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          JAR=$(find paper-plugin/build/libs -name 'MrCrayfishVehiclePlugin-*.jar' -type f | head -1)
          cp "$JAR" "release/MrCrayfishVehiclePlugin-backup.jar"
          cp "paper-plugin/build/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r38.zip" release/
          (cd release && sha256sum * > SHA256SUMS.txt)

      - name: Publish immutable backup release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite the immutable backup."
            exit 1
          fi
          NOTES=$(printf 'Checkpoint complet si stabil (pre-vehicule proprii).\n\nInclude:\n- plugin JAR: garaj global fizic r=2 (/garaj hibrid), scoatere gratuita acasa / cu taxa la public (Vault), podiumuri statice anti-furt permanent (showcase + OP bypass), livrare in garaj la cumparare, salvare asincrona vehicles.yml + garages.yml, [wipe] + mod PURGE;\n- resource pack obligatoriu (modele, texturi, sunete) r38;\n- SHA256SUMS pentru ambele artefacte.\n\nClient vanilla + pack-ul = tot ce trebuie. Rollback instant: checkout acest tag + redeploy.\n')
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "Backup complet ${TAG#backup-release-} - Garaj Global + Podium + Wipe" \
            --notes "$NOTES"
