name: HidenCloud deploy (instant upload)

on:
  push:
    branches:
      - arena/2f9f7b9e-mrcrayfishvehiclemod
    paths:
      - "paper-plugin/**"
      - ".github/workflows/hidencloud-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hidencloud-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PANEL: https://freepanel.hidencloud.com
  SERVER_ID: a4e04808

jobs:
  build:
    name: Build plugin JAR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Testele rulează oricum în CI-ul paralel; aici vrem viteza de deploy.
      - name: Build plugin (skip tests)
        run: ./paper-plugin/gradlew -p paper-plugin clean build -x test

      - name: Upload JAR
        uses: actions/upload-artifact@v5
        with:
          name: plugin-jar
          path: paper-plugin/build/libs/MrCrayfishVehiclePlugin-*.jar
          retention-days: 3

  deploy:
    name: Upload pe HidenCloud + restart
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check secret presentă
        id: guard
        env:
          HIDENCLOUD_API_KEY: ${{ secrets.HIDENCLOUD_API_KEY }}
        run: |
          if [ -z "${HIDENCLOUD_API_KEY:-}" ]; then
            echo "::error title=HIDENCLOUD::lipsește secretul HIDENCLOUD_API_KEY (adaugă-l în Settings → Secrets → Actions)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            # nu-l re-expunem în env; îl cere fiecare pas direct din secrets
          fi

      - name: Download JAR + bundle plugins/
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/download-artifact@v5
        with:
          name: plugin-jar
          path: dist

      - name: Preflight API (cheie + server state)
        if: steps.guard.outputs.enabled == 'true'
        env:
          K3Y: ${{ secrets.HIDENCLOUD_API_KEY }}
        run: |
          set -e
          for URL in "$PANEL" "https://panel.hidencloud.com"; do
            for HDR in "Authorization: Bearer $K3Y" "X-API-Key: $K3Y"; do
              CODE=$(curl -sS -m 15 -o /tmp/acc_probe.json -w '%{http_code}' -H "$HDR" -H 'Accept: application/json' "$URL/api/client/account")
              echo "probe $URL | ${HDR%%:*} → $CODE"
              if [ "$CODE" = 200 ]; then
                WORK_URL="$URL"; WORK_HDR="$HDR"; echo "WORK_$URL_OK=1" >> "$GITHUB_ENV"
                echo "::notice title=HIDENCLOUD::API funcționează via $URL (${HDR%%:*})"
                break 2
              fi
            done
          done
          if [ -z "${WORK_URL:-}" ]; then
            echo "::error title=HIDENCLOUD::nici o combinație nu merge (a4e04808 are nevoie de cheie făcută ÎN ACELAȘI panou ca serverul) — vezi conversația"
            exit 1
          fi
          PANEL="$WORK_URL"; AUTH="$WORK_HDR"
          echo "PANEL=$PANEL" >> "$GITHUB_ENV"; echo "AUTH_MODE=$(echo "$AUTH" | cut -d: -f1)" >> "$GITHUB_ENV"
          EMAIL=$(jq -r '.attributes.email // "?"' /tmp/acc_probe.json)
          echo "::notice title=HIDENCLOUD::cheie validă (cont: $EMAIL)"
          SRV=$(curl -fsS -m 15 -H "$AUTH" -H 'Accept: application/json' "$PANEL/api/client/servers/$SERVER_ID") \
            || { echo "::error title=HIDENCLOUD::serverul $SERVER_ID nu există sau nu e al contului"; exit 1; }
          NAME=$(echo "$SRV" | jq -r '.attributes.name // "?"')
          SUSP=$(echo "$SRV" | jq -r '.attributes.is_suspended // false')
          STATE=$(curl -fsS -m 15 -H "$AUTH" -H 'Accept: application/json' "$PANEL/api/client/servers/$SERVER_ID/resources" | jq -r '.attributes.current_state // "?"')
          echo "::notice title=HIDENCLOUD::server `$NAME` state=$STATE suspended=$SUSP"
          [ "$SUSP" = false ] || { echo "::error title=HIDENCLOUD::serverul e SUSPENDAT — fă Renew în dashboard"; exit 1; }

      - name: Bundle plugins/ în tar.gz
        if: steps.guard.outputs.enabled == 'true'
        run: |
          mkdir -p stage/plugins
          JAR=$(find dist -name 'MrCrayfishVehiclePlugin-*.jar' | head -1)
          cp "$JAR" stage/plugins/MrCrayfishVehiclePlugin.jar
          tar czf bundle.tgz -C stage plugins
          ls -la bundle.tgz

      - name: Upload bundle prin signed URL
        if: steps.guard.outputs.enabled == 'true'
        env:
          K3Y: ${{ secrets.HIDENCLOUD_API_KEY }}
        run: |
          set -e
          if [ "${AUTH_MODE:-}" = "X-API-Key" ]; then AUTH="X-API-Key: $K3Y"; else AUTH="Authorization: Bearer $K3Y"; fi
          U=$(curl -fsS -m 15 -X GET -H "$AUTH" -H 'Accept: application/json' \
               "$PANEL/api/client/servers/$SERVER_ID/files/upload" | jq -r '.attributes.url') \
            || { echo "::error title=HC-UPLOAD::nu am primit URL de upload"; exit 1; }
          # URL-ul are deja tokenul semnat în el — fără Authorization pe POST.
          CODE=$(curl -fsS -m 60 -o /dev/null -w '%{http_code}' --request POST --form files=@bundle.tgz "$U")
          echo "upload: HTTP $CODE"
          [ "$CODE" = 204 -o "$CODE" = 200 -o "$CODE" = 201 ] || { echo "::error title=HC-UPLOAD::upload esuat ($CODE)"; exit 1; }
          echo "::notice title=HC-UPLOAD::bundle urcat (HTTP $CODE)"

      - name: Decompress → plugins/ + stergem arhiva
        if: steps.guard.outputs.enabled == 'true'
        env:
          K3Y: ${{ secrets.HIDENCLOUD_API_KEY }}
        run: |
          set -e
          if [ "${AUTH_MODE:-}" = "X-API-Key" ]; then AUTH="X-API-Key: $K3Y"; else AUTH="Authorization: Bearer $K3Y"; fi
          D=$(curl -fsS -m 60 -X POST -H "$AUTH" -H 'Content-Type: application/json' \
               -d '{"root": "/", "file": "bundle.tgz"}' \
               -o /dev/null -w '%{http_code}' "$PANEL/api/client/servers/$SERVER_ID/files/decompress")
          [ "$D" = 204 ] || { echo "::error title=HC-DECOMPRESS::decompress HTTP $D (conține arhiva plugins/...?)"; exit 1; }
          curl -fsS -m 30 -X POST -H "$AUTH" -H 'Content-Type: application/json' \
               -d '{"root": "/", "files": ["bundle.tgz"]}' \
               -o /dev/null "$PANEL/api/client/servers/$SERVER_ID/files/delete" || true
          echo "::notice title=HC-DECOMPRESS::jar aterizat în /plugins (bundle curățat)"

      - name: Config plugin (scris doar prima dată)
        if: steps.guard.outputs.enabled == 'true'
        env:
          K3Y: ${{ secrets.HIDENCLOUD_API_KEY }}
        run: |
          if [ "${AUTH_MODE:-}" = "X-API-Key" ]; then AUTH="X-API-Key: $K3Y"; else AUTH="Authorization: Bearer $K3Y"; fi
          F=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' -H "$AUTH" \
               "$PANEL/api/client/servers/$SERVER_ID/files/contents?file=%2Fplugins%2FMrCrayfishVehiclePlugin%2Fconfig.yml")
          if [ "$F" = 404 ]; then
            printf '%s\n' \
              'resource-pack:' \
              '  url: "https://github.com/ExMarius/MrCrayfishVehicleMod/releases/download/vehicle-plugin-prototype-v0.1.0/MrCrayfishVehiclePlugin-resourcepack-r38.zip"' \
              '  sha1: "auto"' \
              '  required: true' \
              '  prompt: "Acest resource pack este necesar pentru modelele și sunetele vehiculelor."' \
              'physics:' \
              '  global-speed-limit: 100.0' \
              '  fuel-consumption-factor: 1.0' \
              'performance:' \
              '  activation-distance: 64.0' \
              'gas-pump:' \
              '  max-hose-distance: 10.0' \
              '  fill-seconds: 15.0' \
              'persistence:' \
              '  autosave-seconds: 300' > /tmp/config.yml
            C=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' -X POST -H "$AUTH" -H 'Content-Type: application/x-yaml' \
                 --data-binary @/tmp/config.yml \
                 "$PANEL/api/client/servers/$SERVER_ID/files/write?file=%2Fplugins%2FMrCrayfishVehiclePlugin%2Fconfig.yml")
            [ "$C" = 200 -o "$C" = 204 ] && echo "::notice title=HC-CONFIG::config.yml scris (prima dată)" || echo "::warning title=HC-CONFIG::scrierea config a dat $C — îl poți crea și din panou"
          else
            echo "::notice title=HC-CONFIG::config.yml există deja (neschimbat)"
          fi

      - name: Restart server + aștept să fie online
        if: steps.guard.outputs.enabled == 'true'
        env:
          K3Y: ${{ secrets.HIDENCLOUD_API_KEY }}
        run: |
          if [ "${AUTH_MODE:-}" = "X-API-Key" ]; then AUTH="X-API-Key: $K3Y"; else AUTH="Authorization: Bearer $K3Y"; fi
          P=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' -X POST -H "$AUTH" -H 'Content-Type: application/json' \
               -d '{"signal":"restart"}' "$PANEL/api/client/servers/$SERVER_ID/power")
          [ "$P" = 204 ] || { echo "::error title=HC-POWER::restart HTTP $P"; exit 1; }
          echo "restart trimis (204); aștept online (max 5 min)…"
          for i in $(seq 1 20); do
            sleep 15
            ST=$(curl -fsS -m 15 -H "$AUTH" -H 'Accept: application/json' "$PANEL/api/client/servers/$SERVER_ID/resources" | jq -r '.attributes.current_state // "?"')
            echo "  [$i] $ST"
            [ "$ST" = running ] && break
          done
          if [ "$ST" = running ]; then
            echo "::notice title=HC-DONE::SERVER ONLINE cu noul JAR 🟢"
          else
            echo "::error title=HC-DONE::serverul încă nu e running după 5 min — uită-te în consola panoului"
            exit 1
          fi
