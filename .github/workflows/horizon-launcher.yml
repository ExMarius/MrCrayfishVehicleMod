name: Horizon launcher jar
on:
  workflow_dispatch:
  push:
    paths:
      - "horizon/launcher/Launcher.java"
      - ".github/horizon-launcher.trigger"
permissions:
  contents: write
jobs:
  jar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compilez
        run: |
          set +e
          mkdir -p classes
          javac -encoding UTF-8 -d classes horizon/launcher/Launcher.java > javac.log 2>&1
          code=$?
          echo "javac exit=$code" >> javac.log
          cat javac.log
          [ $code -eq 0 ] || exit 1
          printf 'Main-Class: Launcher\n' > manifest.txt
          jar cfm horizon-launch.jar manifest.txt -C classes .
          ls -lh horizon-launch.jar
      - name: Raport (daca a picat)
        if: always()
        run: |
          { echo "# javac"; cat javac.log 2>/dev/null; echo; echo "# jar"; ls -lh horizon-launch.jar 2>/dev/null; } > horizon/_launcher-build.md
          git config user.name arena-agent
          git config user.email arena-agent@users.noreply.github.com
          git add -f horizon/_launcher-build.md
          git commit -m "raport build lansator [skip ci]" || exit 0
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" >/dev/null 2>&1 || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true

      - name: Public in release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=horizon-arm64
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" horizon-launch.jar --clobber
          else
            gh release create "$TAG" horizon-launch.jar --title "Horizon server (ARM64 + lansator)" --notes "binar aarch64 + jar lansator"
          fi
