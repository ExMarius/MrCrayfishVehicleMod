name: Urc modul .hmod pe panel

# Ia `vehicle.hmod` din release si il pune pe server, in `horizon-mods/`, plus
# fisierul care il porneste (`horizon-mods.txt`). Verifica marimea dupa upload.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/mod-push.trigger"

permissions:
  contents: write

env:
  SFTP_HOST: jacob.hidencloud.com
  SFTP_PORT: "2022"
  SFTP_USER: mariusuke-184939.d496911d

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Pregatesc fisierele
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out
          gh release download horizon-mod --pattern vehicle.hmod --dir out --clobber
          SIZE=$(stat -c %s out/vehicle.hmod)
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "mod.vehicle:true" > out/horizon-mods.txt
          ls -l out

      - name: Urc pe panel
        run: |
          set -euo pipefail
          install -m 600 hidencloud/keys/arena_hc_ed25519 /tmp/hc_key
          sftp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 \
            -o BatchMode=yes -i /tmp/hc_key -P "$SFTP_PORT" "$SFTP_USER@$SFTP_HOST" > sftp.log 2>&1 <<'BATCH'
          -mkdir horizon/horizon-mods
          -rm horizon/horizon-mods/vehicle.hmod
          put out/vehicle.hmod horizon/horizon-mods/vehicle.hmod
          put out/horizon-mods.txt horizon/horizon-mods.txt
          ls -l horizon/horizon-mods/vehicle.hmod
          ls -l horizon/horizon-mods.txt
          BATCH
          tail -8 sftp.log
          if ! grep -qE "[[:space:]]${SIZE}[[:space:]]" sftp.log; then
            echo "::warning title=Upload neverificat::marimea de pe panel nu pare $SIZE"
          fi

      - name: Raport
        if: always()
        run: |
          set +e
          { echo "# mod .hmod pe panel"; echo; tail -12 sftp.log 2>/dev/null; } > horizon/_mod-push.md
          git config user.name arena-agent
          git config user.email arena-agent@users.noreply.github.com
          git add -f horizon/_mod-push.md
          git commit -m "raport upload mod [skip ci]" >/dev/null 2>&1
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" >/dev/null 2>&1
            git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done
