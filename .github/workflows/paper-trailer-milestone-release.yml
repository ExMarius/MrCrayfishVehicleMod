name: Freeze accepted trailer milestone

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout accepted snapshot
        uses: actions/checkout@v5
        with:
          ref: cdfee1f6d448b7d40e4c1b8979155811e42c2538

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test accepted snapshot
        run: ./paper-plugin/gradlew -p paper-plugin clean build resourcePack

      - name: Verify and publish immutable milestone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="paper-trailers-milestone-2026-10-06"
          JAR=$(find paper-plugin/build/libs -name 'MrCrayfishVehiclePlugin-*.jar' -type f | head -1)
          PACK="paper-plugin/build/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r8.zip"
          unzip -t "$PACK"
          test "$(sha1sum "$PACK" | cut -d' ' -f1)" = "3d709a33ade14fded2fcffc33c658a2187072658"
          gh release create "$TAG" "$JAR" "$PACK" \
            --repo "$GITHUB_REPOSITORY" \
            --target cdfee1f6d448b7d40e4c1b8979155811e42c2538 \
            --title "Accepted vehicles and trailers milestone — 2026-10-06" \
            --notes "Immutable backup accepted before experimental rider-body/head-pose work. Includes Go Kart, Lawn Mower, Quad Bike, all five trailers, source-aligned towing/transport, engine-audio r8, plugin JAR, and mandatory resource pack. Resource-pack SHA-1: 3d709a33ade14fded2fcffc33c658a2187072658."
