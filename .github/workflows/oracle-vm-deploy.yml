name: Oracle VM deploy (SSH)

on:
  push:
    branches:
      - arena/2f9f7b9e-mrcrayfishvehiclemod
    paths:
      - "paper-plugin/**"
      - ".github/workflows/oracle-vm-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-vm-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build plugin JAR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Testele rulează oricum în workflow-ul "Paper plugin" la aceleași fișiere;
      # aici sărim peste ele pentru un deploy rapid (~1 min mai scurt).
      - name: Build plugin (skip tests, tested in parallel CI)
        run: ./paper-plugin/gradlew -p paper-plugin clean build -x test

      - name: Upload JAR
        uses: actions/upload-artifact@v5
        with:
          name: plugin-jar
          path: paper-plugin/build/libs/MrCrayfishVehiclePlugin-*.jar
          retention-days: 7

  deploy:
    name: Deploy la VM prin SSH (doar dacă secretele există)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check deploy secrets
        id: guard
        env:
          ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
          ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          missing=0
          for v in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_SSH_KEY ORACLE_VM_KNOWN_HOSTS; do
            if [ -z "${!v:-}" ]; then echo "::notice::lipsește secretul $v"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "Deploy dezactivat până sunt configurate secretele — vezi oracle-vm/README.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download JAR
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/download-artifact@v5
        with:
          name: plugin-jar
          path: dist

      - name: SSH connectivity precheck
        if: steps.guard.outputs.enabled == 'true'
        env:
          ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
          ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          if ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
               "$ORACLE_VM_USER@$ORACLE_VM_HOST" 'echo SSH-OK'; then
            echo "::notice title=DEPLOY::SSH: conectare reușită"
          else
            echo "::error title=DEPLOY::SSH eșuat — verifică cheia/known_hosts/host sau IP-ul"
            exit 1
          fi

      - name: Deploy + restart
        if: steps.guard.outputs.enabled == 'true'
        env:
          ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
          ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          JAR=$(find dist -name 'MrCrayfishVehiclePlugin-*.jar' | head -1)
          echo "→ trimit $(basename "$JAR") pe $ORACLE_VM_USER@$ORACLE_VM_HOST"
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$JAR" "$ORACLE_VM_USER@$ORACLE_VM_HOST:/tmp/plugin-update.jar"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$ORACLE_VM_USER@$ORACLE_VM_HOST" '
              set -e
              sudo install -o mcserver -g mcserver -m 644 /tmp/plugin-update.jar /opt/mcserver/mc/plugins/MrCrayfishVehiclePlugin.jar
              rm -f /tmp/plugin-update.jar
              sudo systemctl restart minecraft.service
              sleep 15
              echo "minecraft: $(systemctl is-active minecraft.service)"
              tail -n 3 /opt/mcserver/logs/server-console.log 2>/dev/null || true
            '
          echo "✅ Deploy reușit și server repornit."
