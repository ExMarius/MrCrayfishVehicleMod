name: Build and deploy plugin to Oracle Cloud Shell

on:
  workflow_dispatch:
  push:
    branches:
      - arena/339da537-mrcrayfishvehiclemod
    paths:
      - .github/oracle-deploy-request
      - .github/workflows/oracle-plugin-deploy.yml
      - paper-plugin/**
      - tools/build_resource_pack.py
      - tools/source_assets/**
      - tools/configure_server_resource_pack.py
      - tools/test_fresh_paper_server.sh

permissions:
  contents: read

concurrency:
  group: oracle-cloud-shell-server
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      requested: ${{ steps.request.outputs.requested }}
    steps:
      - id: request
        shell: bash
        run: |
          # Push path filters already restrict this workflow to deployment inputs;
          # workflow_dispatch is always an explicit deployment request.
          echo "requested=true" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.requested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.2.1'

      - name: Test and build the Oracle deployment
        run: |
          set -euo pipefail
          python3 -m unittest tools/test_build_resource_pack.py tools/test_configure_server_resource_pack.py
          gradle -p paper-plugin clean build resourcePack
          JAR=$(find paper-plugin/build/libs -name 'MrCrayfishVehiclePlugin-*.jar' -type f -print -quit)
          PACK="paper-plugin/build/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r29.zip"
          test -s "$JAR"
          unzip -t "$PACK"
          EXPECTED=$(sed -n 's/^[[:space:]]*sha1: *"\([0-9a-f]*\)".*/\1/p' paper-plugin/src/main/resources/config.yml)
          ACTUAL=$(sha1sum "$PACK" | cut -d' ' -f1)
          test "$EXPECTED" = "$ACTUAL"
          tools/test_fresh_paper_server.sh "$JAR"

      - name: Stage deployment files
        run: |
          set -euo pipefail
          mkdir oracle-deployment
          JAR=$(find paper-plugin/build/libs -name 'MrCrayfishVehiclePlugin-*.jar' -type f -print -quit)
          cp "$JAR" oracle-deployment/MrCrayfishVehiclePlugin.jar
          cp paper-plugin/src/main/resources/config.yml oracle-deployment/config.yml
          cp tools/configure_server_resource_pack.py oracle-deployment/

      - uses: actions/upload-artifact@v5
        with:
          name: oracle-plugin-${{ github.run_id }}
          path: oracle-deployment/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: oracle-plugin-${{ github.run_id }}
          path: oracle-deployment

      - name: Back up, install, restart, and verify
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/minecraft-server"
          SERVER="$ROOT/mc"
          PLUGINS="$SERVER/plugins"
          TARGET="$PLUGINS/MrCrayfishVehiclePlugin.jar"
          DATA="$PLUGINS/MrCrayfishVehiclePlugin"
          BACKUP="$ROOT/backups/plugin-$GITHUB_RUN_ID"
          JAR="$GITHUB_WORKSPACE/oracle-deployment/MrCrayfishVehiclePlugin.jar"
          CONFIG="$GITHUB_WORKSPACE/oracle-deployment/config.yml"
          CONFIGURE="$GITHUB_WORKSPACE/oracle-deployment/configure_server_resource_pack.py"

          phase() { echo "::notice title=Oracle deploy phase::$1"; }
          require_file() {
            if [ ! -s "$1" ]; then
              echo "::error title=Oracle deploy prerequisite missing::$2"
              exit 1
            fi
          }
          phase "Deployment job started"
          require_file "$JAR" "Built plugin artifact was not downloaded"
          require_file "$CONFIG" "Plugin config artifact was not downloaded"
          require_file "$CONFIGURE" "Resource-pack synchronization tool was not downloaded"
          require_file "$ROOT/bin/stop-minecraft.sh" "Minecraft stop script is missing"
          require_file "$ROOT/bin/start-minecraft.sh" "Minecraft start script is missing"
          phase "Artifacts and lifecycle scripts verified"
          mkdir -p "$BACKUP/plugins" "$DATA"
          if ! find "$PLUGINS" -maxdepth 1 -type f -iname 'MrCrayfishVehiclePlugin*.jar' -exec cp -p {} "$BACKUP/plugins/" \;; then
            echo "::error title=Oracle backup failed::Could not back up the installed plugin JAR"
            exit 1
          fi
          [ ! -f "$DATA/config.yml" ] || cp -p "$DATA/config.yml" "$BACKUP/config.yml"
          if ! cp -p "$SERVER/server.properties" "$BACKUP/server.properties"; then
            echo "::error title=Oracle backup failed::Could not back up server.properties"
            exit 1
          fi
          phase "Backup created"

          server_changed=false
          rollback_on_error() {
            rc=$?
            trap - ERR
            if [ "$server_changed" = true ]; then
              echo "::warning title=Oracle deployment rollback::Restoring the previous plugin and server.properties"
              bash "$ROOT/bin/stop-minecraft.sh" || true
              find "$PLUGINS" -maxdepth 1 -type f -iname 'MrCrayfishVehiclePlugin*.jar' -delete
              find "$BACKUP/plugins" -maxdepth 1 -type f -name '*.jar' -exec cp -p {} "$PLUGINS/" \;
              [ ! -f "$BACKUP/config.yml" ] || cp -p "$BACKUP/config.yml" "$DATA/config.yml"
              cp -p "$BACKUP/server.properties" "$SERVER/server.properties"
              bash "$ROOT/bin/start-minecraft.sh" || true
            fi
            exit "$rc"
          }
          trap rollback_on_error ERR

          PACK_URL=$(sed -n 's/^[[:space:]]*url: *"\([^"]*\)".*/\1/p' "$CONFIG")
          PACK_SHA1=$(sed -n 's/^[[:space:]]*sha1: *"\([0-9a-f]*\)".*/\1/p' "$CONFIG")
          test -n "$PACK_URL"
          test -n "$PACK_SHA1"
          available=0
          for _ in $(seq 1 30); do
            if curl -fsSL --connect-timeout 15 "$PACK_URL" -o /tmp/oracle-resource-pack.zip \
                && [ "$(sha1sum /tmp/oracle-resource-pack.zip | cut -d' ' -f1)" = "$PACK_SHA1" ]; then
              available=1
              break
            fi
            sleep 10
          done
          if [ "$available" -ne 1 ]; then
            echo "::error title=Resource pack unavailable::The published pack did not match the configured SHA-1"
            exit 1
          fi
          phase "Resource pack URL and SHA-1 verified"

          python3 "$CONFIGURE" \
            --server-properties "$SERVER/server.properties" \
            --plugin-config "$CONFIG" \
            --output "$BACKUP/server.properties.updated"
          grep -q "^resource-pack-sha1=$PACK_SHA1$" "$BACKUP/server.properties.updated"
          grep -q '^require-resource-pack=true$' "$BACKUP/server.properties.updated"
          phase "Updated server.properties prepared and validated"

          if screen -list 2>/dev/null | grep -q '[.]mcv-minecraft[[:space:]]'; then
            if ! bash "$ROOT/bin/stop-minecraft.sh"; then
              echo "::warning title=Oracle stop recovery::Normal stop failed; closing only the mcv-minecraft screen session"
              sessions=$(screen -list 2>/dev/null | awk '$1 ~ /^[0-9]+[.]mcv-minecraft$/ {print $1}')
              for session in $sessions; do
                screen -S "$session" -X quit || true
                screen_pid=${session%%.*}
                kill -TERM "$screen_pid" 2>/dev/null || true
              done
              for _ in $(seq 1 15); do
                screen -list 2>/dev/null | grep -q '[.]mcv-minecraft[[:space:]]' || break
                sleep 1
              done
              sessions=$(screen -list 2>/dev/null | awk '$1 ~ /^[0-9]+[.]mcv-minecraft$/ {print $1}')
              for session in $sessions; do
                screen_pid=${session%%.*}
                kill -KILL "$screen_pid" 2>/dev/null || true
              done
              screen -wipe >/dev/null 2>&1 || true
            fi
            if screen -list 2>/dev/null | grep -q '[.]mcv-minecraft[[:space:]]'; then
              echo "::error title=Oracle stop failed::The mcv-minecraft screen session is still running"
              exit 1
            fi
            phase "Minecraft stopped cleanly"
          else
            phase "Minecraft was already stopped"
          fi
          server_changed=true
          find "$PLUGINS" -maxdepth 1 -type f -iname 'MrCrayfishVehiclePlugin*.jar' -delete
          install -m 600 "$JAR" "$TARGET"
          install -m 600 "$CONFIG" "$DATA/config.yml"
          install -m 600 "$BACKUP/server.properties.updated" "$SERVER/server.properties"

          start_epoch=$(date +%s)
          : > "$ROOT/logs/server-console.log"
          bash "$ROOT/bin/start-minecraft.sh"
          phase "Updated plugin installed and Minecraft started"
          ready=0
          for _ in $(seq 1 120); do
            latest_mtime=$(stat -c %Y "$SERVER/logs/latest.log" 2>/dev/null || echo 0)
            if [ "$latest_mtime" -ge "$start_epoch" ] \
                && grep -q 'MrCrayfishVehiclePlugin.*Enabling\|Enabling MrCrayfishVehiclePlugin' "$SERVER/logs/latest.log" 2>/dev/null \
                && grep -q 'Done (' "$SERVER/logs/latest.log" 2>/dev/null \
                && ss -ltn 2>/dev/null | grep -q ':25565'; then
              ready=1
              break
            fi
            if ! screen -list 2>/dev/null | grep -q '[.]mcv-minecraft[[:space:]]'; then
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error title=Oracle deployment failed::Minecraft did not become healthy; rollback will start now"
            tail -80 "$ROOT/logs/server-console.log" || true
            false
          fi

          server_changed=false
          trap - ERR
          find "$ROOT/backups" -mindepth 1 -maxdepth 1 -type d -name 'plugin-*' -printf '%T@ %p\n' \
            | sort -rn | tail -n +6 | cut -d' ' -f2- | xargs -r rm -rf
          echo "::notice title=Oracle deployment::Plugin deployed, resource pack synchronized, and Minecraft is ready on local port 25565"
