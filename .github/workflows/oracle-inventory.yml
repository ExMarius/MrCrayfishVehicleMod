name: Oracle Cloud Shell inventory

on:
  workflow_dispatch:
  push:
    branches:
      - arena/339da537-mrcrayfishvehiclemod
    paths:
      - .github/workflows/oracle-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    name: Inspect existing Cloud Shell server safely
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inventory without reading configuration contents
        shell: bash
        run: |
          set -euo pipefail

          notice() {
            local value="$1"
            value="${value//'%'/'%25'}"
            value="${value//$'\r'/'%0D'}"
            value="${value//$'\n'/'%0A'}"
            echo "::notice title=Oracle inventory::$value"
          }

          notice "user=$(id -un) home=$HOME arch=$(uname -m)"
          notice "home-disk=$(df -hP "$HOME" | tail -1 | awk '{print $2" total, "$3" used, "$4" free ("$5")"}')"
          notice "java=$(java -version 2>&1 | head -1 || true)"

          candidates=$(find "$HOME" -maxdepth 6 -type f \
            \( -name server.properties -o -name eula.txt -o -iname 'paper*.jar' \
               -o -iname 'purpur*.jar' -o -iname 'spigot*.jar' -o -name start.sh \) \
            -not -path '*/actions-runner/_work/*' -print 2>/dev/null | sort | paste -sd'|' -)
          notice "server-candidates=${candidates:-none}"

          java_processes=""
          while IFS= read -r pid; do
            [ -n "$pid" ] || continue
            cwd=$(readlink -f "/proc/$pid/cwd" 2>/dev/null || echo unknown)
            java_processes+="pid=$pid cwd=$cwd|"
          done < <(pgrep -x java 2>/dev/null || true)
          notice "java-processes=${java_processes:-none}"

          tmux_sessions=none
          if command -v tmux >/dev/null 2>&1; then
            tmux_sessions=$(tmux list-sessions -F '#{session_name}' 2>/dev/null | paste -sd, - || true)
            tmux_sessions=${tmux_sessions:-none}
          fi
          screen_sessions=none
          if command -v screen >/dev/null 2>&1; then
            screen_sessions=$(screen -ls 2>/dev/null | sed -n 's/^[[:space:]]*[0-9][0-9]*\.\([^[:space:]]*\).*/\1/p' | paste -sd, - || true)
            screen_sessions=${screen_sessions:-none}
          fi
          notice "tmux-sessions=$tmux_sessions screen-sessions=$screen_sessions"

          entries=$(du -sh "$HOME"/* 2>/dev/null | sort -h | tail -20 | tr '\n' '|')
          notice "home-entries=${entries:-none}"

          tools=""
          for tool in tmux screen sshpass sftp rsync tar python3 curl; do
            if command -v "$tool" >/dev/null 2>&1; then
              tools+="$tool=$(command -v "$tool")|"
            else
              tools+="$tool=missing|"
            fi
          done
          notice "tools=$tools"
