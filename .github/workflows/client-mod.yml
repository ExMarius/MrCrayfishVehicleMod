name: Client mod (MCV Seat Lock)

# Construieste modul de client (Fabric 1.21.4) care tine corpul jucatorului
# lipit de vehicul; capul/camera raman libere la mouse. Serverul (pluginul) nu
# poate face asta: clientul refuza pachetele de rotatie cat timp esti pasager
# ("Invalid move player packet received" / "Cannot interact with self!").

on:
  workflow_dispatch:
  push:
    branches:
      - arena/2f9f7b9e-mrcrayfishvehiclemod
    paths:
      - "client-mod/**"
      - ".github/workflows/client-mod.yml"

permissions:
  contents: write

jobs:
  build:
    name: Compilez modul de client
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Diagnostic classpath
        run: |
          ./client-mod/gradlew -p client-mod printCp --no-daemon > client-mod/cp.log 2>&1 || true
          CJ=$(grep -a "^CP:" client-mod/cp.log | grep "minecraft-merged" | head -1 | sed 's/^CP: //')
          { echo "=== JAR ==="; echo "$CJ"; ls -l "$CJ" 2>/dev/null; echo "=== CONTINE CLIENT? ==="; unzip -l "$CJ" 2>/dev/null | grep -c "net/minecraft/client/player/LocalPlayer" || echo "unzip fail"; unzip -l "$CJ" 2>/dev/null | grep -c "net/minecraft/" || true; echo "=== LOOM ==="; grep -a -i -E "loom|mappings" client-mod/cp.log | head -10; } > client-mod/BUILD-ERROR.txt
          git config user.name "arena-bot"; git config user.email "bot@arena.local"
          git add client-mod/BUILD-ERROR.txt; git commit -m "Diagnostic: classpath mod client (automat)" || true
          git pull --rebase -q || true; git push || true

      - name: Gradle build (Fabric Loom)
        run: |
          set +e
          ./client-mod/gradlew -p client-mod build --no-daemon --stacktrace > client-mod/build.log 2>&1
          status=$?
          echo "exit=$status"
          tail -n 60 client-mod/build.log || true
          if [ "$status" -ne 0 ]; then
            { grep -a -E "error:|Caused by:|What went wrong|Could not|FAILURE:|Could not resolve|BUILD FAILED|mappings|Minecraft" client-mod/build.log | head -60; echo "---- PRIMELE 40 LINII ----"; head -n 40 client-mod/build.log; } > client-mod/BUILD-ERROR.txt
            git config user.name "arena-bot"
            git config user.email "bot@arena.local"
            git add client-mod/BUILD-ERROR.txt
            git commit -m "Diagnostic: eroare build mod client (automat)" || true
            git pull --rebase -q || true
            git push || true
            exit "$status"
          fi

      - name: Publicez jar-ul in release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="vehicle-plugin-prototype-v0.1.0"
          JAR=$(ls client-mod/build/libs/*.jar | grep -v sources | head -1)
          echo "Jar: $JAR"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Vehicle plugin prototype" --notes "Build automat"
          gh release upload "$TAG" "$JAR" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: mcv-seatlock
          path: client-mod/build/libs/*.jar
