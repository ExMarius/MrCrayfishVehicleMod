name: Urc engine-ul din release pe panel

# Ia binarul `horizon-engine-mod` din release si il pune pe panel, fortand
# suprascrierea (sterge intai) si verificand la final ca marimea se potriveste.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/engine-push.trigger"

permissions:
  contents: read

env:
  SFTP_HOST: jacob.hidencloud.com
  SFTP_PORT: "2022"
  SFTP_USER: mariusuke-184939.d496911d

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Ia binarul din release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out
          gh release download horizon-engine-mod --pattern horizon-engine-mod --dir out --clobber
          ls -l out/horizon-engine-mod
          sha256sum out/horizon-engine-mod | tee out/sha.txt
          echo "SIZE=$(stat -c %s out/horizon-engine-mod)" >> "$GITHUB_ENV"

      - name: Urc si verific
        env:
          HIDENCLOUD_SFTP_KEY: ${{ secrets.HIDENCLOUD_SFTP_KEY }}
        run: |
          set -euo pipefail
          # cheia vine din secretul HIDENCLOUD_SFTP_KEY; fisierul din repo e doar
          # rezerva pentru build-urile vechi si trebuie sters dupa rotire
          if [ -n "${HIDENCLOUD_SFTP_KEY:-}" ]; then
            printf '%s\n' "$HIDENCLOUD_SFTP_KEY" > /tmp/hc_key
            chmod 600 /tmp/hc_key
          else
            install -m 600 hidencloud/keys/arena_hc_ed25519 /tmp/hc_key
          fi
          sftp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 \
            -o BatchMode=yes -i /tmp/hc_key -P "$SFTP_PORT" "$SFTP_USER@$SFTP_HOST" > sftp.log 2>&1 <<'BATCH'
          -rm horizon/horizon-engine-mod
          put out/horizon-engine-mod horizon/horizon-engine-mod
          chmod 755 horizon/horizon-engine-mod
          ls -l horizon/horizon-engine-mod
          BATCH
          tail -6 sftp.log
          REMOTE=$(grep -oE '^horizon/horizon-engine-mod' -m1 sftp.log || true)
          # marimea raportata de ls trebuie sa fie cea locala
          if ! grep -qE "[[:space:]]${SIZE}[[:space:]]" sftp.log; then
            echo "::error title=Upload neverificat::marimea de pe panel nu e $SIZE"
            exit 1
          fi

      - name: Raport
        if: always()
        run: |
          set +e
          mkdir -p horizon
          { echo "# ultima urcare de engine pe panel"; echo; tail -12 sftp.log 2>/dev/null; echo; cat out/sha.txt 2>/dev/null; } > horizon/_engine-push.md
          git config user.name arena-agent
          git config user.email arena-agent@users.noreply.github.com
          git add -f horizon/_engine-push.md
          git commit -m "urcare engine [skip ci]" >/dev/null 2>&1
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" >/dev/null 2>&1 || true
          git push origin "HEAD:$GITHUB_REF_NAME" >/dev/null 2>&1 || true
