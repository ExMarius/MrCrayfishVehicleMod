name: Falix diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/falix-log-request"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Falix logs
        env:
          FALIX_SFTP_HOST: ${{ secrets.FALIX_SFTP_HOST }}
          FALIX_SFTP_PORT: ${{ secrets.FALIX_SFTP_PORT }}
          FALIX_SFTP_USERNAME: ${{ secrets.FALIX_SFTP_USERNAME }}
          FALIX_SFTP_PASSWORD: ${{ secrets.FALIX_SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in FALIX_SFTP_HOST FALIX_SFTP_PORT FALIX_SFTP_USERNAME FALIX_SFTP_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "::error title=Missing FalixNodes secret::${variable} is not configured."
              exit 1
            fi
          done
          if ! [[ "$FALIX_SFTP_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid FalixNodes secret::FALIX_SFTP_PORT must be numeric."
            exit 1
          fi
          SFTP_HOST="${FALIX_SFTP_HOST#sftp://}"
          SFTP_HOST="${SFTP_HOST%%/*}"
          SFTP_HOST="${SFTP_HOST%%:*}"
          test -n "$SFTP_HOST"

          sudo apt-get update -qq
          sudo apt-get install --yes --quiet sshpass
          mkdir -p falix-diagnostics
          export SSHPASS="$FALIX_SFTP_PASSWORD"
          sshpass -e sftp \
            -oBatchMode=no \
            -oPreferredAuthentications=password \
            -oPubkeyAuthentication=no \
            -oStrictHostKeyChecking=accept-new \
            -oConnectTimeout=20 \
            -P "$FALIX_SFTP_PORT" \
            "${FALIX_SFTP_USERNAME}@${SFTP_HOST}" <<EOF
          get logs/latest.log falix-diagnostics/latest.log
          -get -R crash-reports falix-diagnostics/crash-reports
          EOF
          unset SSHPASS FALIX_SFTP_PASSWORD
          test -s falix-diagnostics/latest.log

      - name: Report sanitized warnings and errors
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("falix-diagnostics/latest.log").read_text(encoding="utf-8", errors="replace")
          text = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", text)
          lines = text.splitlines()
          timestamp = re.compile(r"^\[[0-9]{2}:[0-9]{2}:[0-9]{2}\]")
          important = re.compile(
              r"\b(?:WARN|ERROR)\b|Exception|Caused by:|Watchdog|Server thread dump|"
              r"Failed to|Could not|Unable to|NoClassDefFoundError|StackOverflowError",
              re.IGNORECASE,
          )
          redact_ip = re.compile(r"\b(?:\d{1,3}\.){3}\d{1,3}\b")
          redact_uuid = re.compile(r"\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b", re.I)

          incidents = []
          consumed_until = -1
          for index, line in enumerate(lines):
              if index <= consumed_until or not important.search(line):
                  continue
              block = [line]
              end = index
              for following in lines[index + 1:index + 18]:
                  if timestamp.match(following) and not important.search(following):
                      break
                  block.append(following)
                  end += 1
              consumed_until = end
              message = "\n".join(block).strip()
              message = redact_ip.sub("<ip-redacted>", message)
              message = redact_uuid.sub("<uuid-redacted>", message)
              if message and message not in incidents:
                  incidents.append(message)
              if len(incidents) == 40:
                  break

          watchdog_index = next(
              (index for index, line in enumerate(lines) if "server has not responded" in line.lower()),
              None,
          )
          if watchdog_index is not None:
              context = "\n".join(lines[max(0, watchdog_index - 30):watchdog_index + 2])
              context = redact_ip.sub("<ip-redacted>", context)
              context = redact_uuid.sub("<uuid-redacted>", context)
              escaped = context.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::warning title=Falix pre-watchdog context::{escaped[:6000]}")

          if not incidents:
              print("::notice title=Falix diagnostics::No WARN, ERROR, exception, or watchdog lines found in latest.log.")
          for number, message in enumerate(incidents, 1):
              escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::warning title=Falix diagnostic {number}::{escaped[:6000]}")
          print(f"Found {len(incidents)} sanitized diagnostic incident(s).")
          PY

      - name: Upload private diagnostic artifact
        uses: actions/upload-artifact@v5
        with:
          name: falix-diagnostics-${{ github.run_id }}
          path: falix-diagnostics/
          if-no-files-found: error
          retention-days: 1
