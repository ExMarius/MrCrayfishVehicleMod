name: VM port check

on:
  push:
    branches:
      - arena/2f9f7b9e-mrcrayfishvehiclemod
    paths:
      - ".github/workflows/vm-port-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verific 25565 si 8081 din exterior + diag pe VM
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Secrets + SSH creds
        env:
          ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
          ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          [ -n "$ORACLE_VM_HOST$ORACLE_VM_USER$ORACLE_VM_SSH_KEY$ORACLE_VM_KNOWN_HOSTS" ] || { echo "::error::lipsesc secretele ORACLE_VM_*"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "VM_USER=$ORACLE_VM_USER" >> "$GITHUB_ENV"
          echo "VM_HOST=$ORACLE_VM_HOST" >> "$GITHUB_ENV"

      - name: Diag pe VM (listeneri + ufw + servicii)
        run: |
          D=$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$VM_USER@$VM_HOST" 'L25565=$(ss -tlnH "sport = :25565" | wc -l); L8081=$(ss -tlnH "sport = :8081" | wc -l); SVC=$(systemctl is-active minecraft),$(systemctl is-active mcvehicles-panel); UFW=$(sudo ufw status 2>/dev/null | head -1); echo "listen25565=$L25565 listen8081=$L8081 servicii=$SVC ufw=$UFW"; echo "OOM: $(sudo dmesg 2>/dev/null | grep -iE "killed process|oom" | tail -3 | tr "\n" ";" )"; echo "CONSOLE-TAIL: $(tail -4 /opt/mcserver/logs/server-console.log 2>/dev/null | tr "\n" ";")"' 2>&1) || D="SSH-EȘUAT: $(echo "$D" | tail -1)"
          echo "$D"
          one_line() {
            local v="${1//'%'/'%25'}"; v="${v//$'\r'/'%0D'}"; v="${v//$'\n'/'%0A'}"
            echo "::notice title=VMDIAG::${v}"
          }
          one_line "$D"

      - name: Dump ufw + iptables INPUT, auto-fix REJECT-ul din imaginea OCI
        run: |
          U=$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$VM_USER@$VM_HOST" '
                IN=$(sudo iptables -L INPUT -n --line-numbers | head -12 | tr "\n" ";")
                echo "IPTABLES-INPUT: $IN"
                for p in 25565 8081; do
                  sudo iptables -C INPUT -p tcp --dport $p -m conntrack --ctstate NEW -j ACCEPT 2>/dev/null \
                    || sudo iptables -I INPUT -p tcp --dport $p -m conntrack --ctstate NEW -j ACCEPT
                done
                # persistență peste reboot:
                if command -v netfilter-persistent >/dev/null 2>&1; then sudo netfilter-persistent save >/dev/null 2>&1 || true; fi
                echo IPTABLES-FIX-DONE
              ' 2>&1) || true
          echo "$U"
          v="${U//'%'/'%25'}"; v="${v//$'\r'/'%0D'}"; v="${v//$'\n'/'%0A'}"
          echo "::notice title=IPTABLES::${v}"
          sleep 4

      - name: SFTP write diag + auto-fix ACL (plugins upload)
        run: |
          U=$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$VM_USER@$VM_HOST" '
                echo "GRUPURI-UBUNTU: $(id ubuntu)"
                echo "ACL-INAINTE:"; getfacl -p /opt/mcserver/mc/plugins 2>/dev/null | grep -E "group:|group:mcserver|mask" || echo "(fara ACL-uri)"
                sudo usermod -aG mcserver ubuntu
                sudo setfacl -R -m g:mcserver:rwX,m::rwX /opt/mcserver
                sudo setfacl -R -d -m g:mcserver:rwX,m::rwX /opt/mcserver
                sudo -u ubuntu touch /opt/mcserver/mc/plugins/.sftp-write-test \
                  && { rm -f /opt/mcserver/mc/plugins/.sftp-write-test; echo WRITE-TEST-OK; } \
                  || echo WRITE-TEST-FAIL
              ' 2>&1) || U="SSH-EȘUAT: $(echo "$U" | tail -2)"
          echo "$U"
          v="${U//'%'/'%25'}"; v="${v//$'\r'/'%0D'}"; v="${v//$'\n'/'%0A'}"
          echo "::notice title=SFTP-ACL::${v}"

      - name: Restart java daca listenerul 25565 a disparut (OOM-watch)
        run: |
          R=$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$VM_USER@$VM_HOST" '
                if ss -tlnH "sport = :25565" 2>/dev/null | grep -q .; then
                  echo "listener-ok, fara restart"
                else
                  echo "LISTENER-LIPSA → restart minecraft…"
                  sudo systemctl restart minecraft.service
                  sleep 45
                  ss -tlnH "sport = :25565" 2>/dev/null | grep -q . && echo "restart-ok, asculta din nou" || echo "inca nu asculta (poate inca booteaza)"
                fi' 2>&1) || R="SSH-EȘUAT"
          echo "$R"
          v="${R//'%'/'%25'}"; v="${v//$'\r'/'%0D'}"; v="${v//$'\n'/'%0A'}"
          echo "::notice title=RESTART-25565::${v}"

      - name: Porturi din exterior
        run: |
          for p in 22 25565 8081; do
            if timeout 6 bash -c "echo > /dev/tcp/$VM_HOST/$p" 2>/dev/null; then
              echo "::notice title=PORT-$p::deschis din exterior"
            else
              echo "::error title=PORT-$p::INCHIS din exterior"
            fi
          done
          exit 0
