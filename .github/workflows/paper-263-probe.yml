name: Probe port 26.3

# Compile-only probe: cat de mari sunt modificarile de API intre 1.21.4 si 26.3
# pentru paper-plugin/. Nu produce artefact, nu face deploy. Rezultatul (lista de
# erori de compilare) se publica ca si comentariu pe commit, pentru ca log-urile
# de Actions nu sunt accesibile din sandbox.

on:
  workflow_dispatch:
    inputs:
      paperApi:
        description: "Versiunea paper-api"
        default: "26.3.build.259-stable"
        required: false
      javaVersion:
        description: "Versiunea Java (toolchain)"
        default: "25"
        required: false

permissions:
  contents: write

concurrency:
  group: probe-263-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.javaVersion }}

      - uses: gradle/actions/setup-gradle@v5

      - name: Compile against ${{ inputs.paperApi }}
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          ./paper-plugin/gradlew -p paper-plugin --no-daemon \
            -PpaperApi="${{ inputs.paperApi }}" \
            -PjavaVersion="${{ inputs.javaVersion }}" \
            compileJava 2>&1 | tee /tmp/compile.log | tail -n 120
          exit "${PIPESTATUS[0]}"

      - name: Sumar
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT=/tmp/summary.md
          {
            echo "### Probe port ${{ inputs.paperApi }} (Java ${{ inputs.javaVersion }})"
            echo ""
            echo "Rezultat: **${{ steps.compile.outcome }}**"
            echo ""
            if [ "${{ steps.compile.outcome }}" != "success" ]; then
              ERRS=$(grep -c "^e: " /tmp/compile.log || true)
              echo "Erori de compilare (Kotlin/Java): $ERRS"
              echo ""
              echo '```'
              grep "^e: " /tmp/compile.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -n 80 || tail -n 80 /tmp/compile.log
              echo '```'
            else
              echo "Compileaza curat pe aceasta versiune de API."
            fi
          } > "$OUT"
          head -c 60000 "$OUT" > /tmp/summary_cut.md
          gh api --method POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@/tmp/summary_cut.md
