name: Oracle VM provision (setup complet de la zero)

on:
  push:
    branches:
      - arena/2f9f7b9e-mrcrayfishvehiclemod
    paths:
      - ".github/workflows/oracle-vm-provision.yml"
      - "oracle-vm/setup.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-vm-provision
  cancel-in-progress: false

jobs:
  provision:
    name: Instalează totul pe VM prin SSH (0 operațiuni manuale)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check secrets
        id: guard
        env:
          ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
          ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          missing=0
          for v in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_SSH_KEY ORACLE_VM_KNOWN_HOSTS; do
            if [ -z "${!v:-}" ]; then echo "::error::lipsește secretul $v"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "VM_USER=$ORACLE_VM_USER" >> "$GITHUB_ENV"
            echo "VM_HOST=$ORACLE_VM_HOST" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v5
        if: steps.guard.outputs.enabled == 'true'

      - name: Prepare SSH credentials
        if: steps.guard.outputs.enabled == 'true'
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload setup.sh pe VM
        if: steps.guard.outputs.enabled == 'true'
        run: |
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            oracle-vm/setup.sh "$VM_USER@$VM_HOST:/tmp/setup.sh"
          echo "::notice title=PROVISION::setup.sh urcat pe vm ($VM_HOST)"

      - name: Setup faza 1/2 — /etc/mcserver.env
        if: steps.guard.outputs.enabled == 'true'
        run: |
          OUT=$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
               "$VM_USER@$VM_HOST" 'sudo bash /tmp/setup.sh' 2>&1) && RC=0 || RC=$?
          echo "$OUT" | tail -8
          if [ "$RC" != 0 ]; then
            echo "::error title=PROVISION-FAZA1::esuat rc=$RC (vezi logul run-ului)"
            exit "$RC"
          fi
          echo "::notice title=PROVISION::faza 1 ok - /etc/mcserver.env creat/exista"

      - name: Setup faza 2/2 — instalare completa (~10 min)
        if: steps.guard.outputs.enabled == 'true'
        run: |
          OUT=$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
               "$VM_USER@$VM_HOST" 'sudo bash /tmp/setup.sh' 2>&1) && RC=0 || RC=$?
          echo "$OUT" | tail -30
          if [ "$RC" != 0 ]; then
            TAIL=$(echo "$OUT" | tail -5 | head -c 600)
            TAIL="${TAIL//'%'/'%25'}"; TAIL="${TAIL//$'\r'/'%0D'}"; TAIL="${TAIL//$'\n'/'%0A'}"
            echo "::error title=PROVISION-FAZA2::esuat rc=$RC | $TAIL"
            exit "$RC"
          fi
          STATE=$(echo "$OUT" | grep -oE 'panel=[a-z]+ minecraft=[a-z]+' | tail -1)
          echo "::notice title=PROVISION::instalare ok | servicii: ${STATE:-neclar}"
          # gata cu /tmp/setup.sh (rămâne doar pe VM, inofensiv)

      - name: Aștept pornirea completă a lumii (până la 12 min)
        if: steps.guard.outputs.enabled == 'true'
        run: |
          OUT=$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
               "$VM_USER@$VM_HOST" '
                 for i in $(seq 1 144); do
                   grep -q "Done (" /opt/mcserver/logs/server-console.log 2>/dev/null && { echo BOOT-OK; sed -n "s/.*Done (\([0-9.]*s\)).*/caturesa de pornire: \1/p" /opt/mcserver/logs/server-console.log | tail -1; exit 0; }
                   sudo systemctl is-active minecraft >/dev/null 2>&1 || { echo MC-SERVICE-DOWN; tail -5 /opt/mcserver/logs/server-console.log 2>/dev/null; exit 1; }
                   sleep 5
                 done
                 echo BOOT-TIMEOUT; tail -5 /opt/mcserver/logs/server-console.log; exit 1
               ' 2>&1) && RC=0 || RC=$?
          echo "$OUT" | tail -8
          if echo "$OUT" | grep -q MOTD_MARKER_BOOT_OK || echo "$OUT" | grep -q '^BOOT-OK'; then
            echo "::notice title=PROVISION::paper pornit complet (lume generata)"
          else
            LAST=$(echo "$OUT" | tail -4 | head -c 500)
            LAST="${LAST//'%'/'%25'}"; LAST="${LAST//$'\r'/'%0D'}"; LAST="${LAST//$'\n'/'%0A'}"
            echo "::error title=PROVISION-BOOT::lumea nu a pornit in 12 min | $LAST"
            exit 1
          fi

      - name: Reachability extern — verific OCI Security List (din afara retelei tale)
        id: reach
        if: steps.guard.outputs.enabled == 'true'
        run: |
          GAME=closed; timeout 6 bash -c "echo > /dev/tcp/$VM_HOST/25565" 2>/dev/null && GAME=open
          PANEL=closed; CODE=$(curl -fsS -m 10 -o /dev/null -w '%{http_code}' "http://$VM_HOST:8081/" 2>/dev/null) && PANEL="open($CODE)"
          echo "game=$GAME" >> "$GITHUB_OUTPUT"
          echo "panel=$PANEL" >> "$GITHUB_OUTPUT"
          if [ "$GAME" = open ]; then
            echo "::notice title=REACHABLE-25565::portul de joc e deschis si din exterior"
          else
            echo "::error title=REACHABLE-25565::BLOCAT - lipseste regula TCP 25565 in Security List (OCI Console)"
          fi
          case "$PANEL" in
            closed) echo "::error title=REACHABLE-8081::BLOCAT - lipseste regula TCP 8081 in Security List (OCI Console)" ;;
            *)      echo "::notice title=REACHABLE-8081::panoul raspunde din exterior ($PANEL)" ;;
          esac

      - name: Sumar final
        if: always()
        run: |
          {
            echo "## Provisioning VM ($VM_HOST)"
            echo "- Port joc 25565 din exterior: $(echo '${{ steps.reach.outputs.game }}')"
            echo "- Panou 8081 din exterior: $(echo '${{ steps.reach.outputs.panel }}')"
          } >> "$GITHUB_STEP_SUMMARY"
