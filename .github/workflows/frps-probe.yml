name: FRP server probe

on:
  workflow_dispatch:
    inputs:
      host:
        description: "frps host (IP sau domeniu) de verificat"
        required: true
        type: string
  push:
    branches:
      - arena/2f9f7b9e-mrcrayfishvehiclemod
    paths:
      - .github/workflows/frps-probe.yml

permissions:
  contents: read

env:
  HOST: ${{ github.event.inputs.host || '140.238.218.210' }}

jobs:
  probe:
    name: Probe frps reachability
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "port-7000 frps control"
        continue-on-error: true
        env:
          CHECK: p7000
        run: |
          emit() {
            local v="${1//'%'/'%25'}"; v="${v//$'\r'/'%0D'}"; v="${v//$'\n'/'%0A'}"
            echo "::notice title=PROBE-RESULT::$CHECK: $v"
          }
          if timeout 6 bash -c "exec 3<>/dev/tcp/$HOST/7000" 2>/dev/null; then
            echo "PORT 7000 (frps control): OPEN"
            emit "OPEN (frps rulează)"
          else
            echo "PORT 7000 (frps control): CLOSED"
            emit "CLOSED-or-FILTERED (frps oprit sau firewall)"
            exit 1
          fi

      - name: "minecraft-25565 server-list-ping"
        continue-on-error: true
        env:
          CHECK: mcping
        run: |
          emit() {
            local v="${1//'%'/'%25'}"; v="${v//$'\r'/'%0D'}"; v="${v//$'\n'/'%0A'}"
            echo "::notice title=PROBE-RESULT::$CHECK: $v"
          }
          OUT=$(python3 - "$HOST" 25565 <<'PYEOF'
          import json, socket, sys

          def write_varint(v):
              out = bytearray()
              while True:
                      t = v & 0x7F
                      v >>= 7
                      if v: out.append(t | 0x80)
                      else:
                          out.append(t); break
              return bytes(out)

          def read_varint(s):
              n = 0; sh = 0
              while True:
                  b = s.recv(1)
                  if not b: raise IOError("eof")
                  n |= (b[0] & 0x7F) << sh
                  if not b[0] & 0x80: break
                  sh += 7
              return n

          host, port = sys.argv[1], int(sys.argv[2])
          try:
              s = socket.create_connection((host, port), timeout=6)
          except OSError as e:
              print("OFFLINE|TCP closed (%s)" % e)
              sys.exit(1)
          addr = host.encode()
          hs = write_varint(0) + write_varint(47) + write_varint(len(addr)) + addr + port.to_bytes(2, "big") + write_varint(1)
          s.sendall(write_varint(len(hs)) + hs)
          s.sendall(write_varint(1) + write_varint(0))
          s.settimeout(6)
          read_varint(s); read_varint(s)
          ln = read_varint(s)
          data = b""
          while len(data) < ln:
              chunk = s.recv(ln - len(data))
              if not chunk: break
              data += chunk
          try:
              d = json.loads(data)
          except ValueError:
              print("GARBAGE|TCP open dar nu raspunde ca un server Minecraft")
              sys.exit(1)
          ver = d.get("version", {})
          pl = d.get("players", {})
          motd = d.get("description")
          if isinstance(motd, dict): motd = motd.get("text", str(motd))
          print("ONLINE|%s (proto %s)|jucatori %s/%s|motd %s" % (
              ver.get("name"), ver.get("protocol"), pl.get("online"), pl.get("max"),
              str(motd)[:80].replace("|", "/")))
          PYEOF
          ) || RC=1
          RC=${RC:-0}
          echo "$OUT"
          emit "$OUT"
          [ "$RC" = "0" ] || exit 1

      - name: "panel-8081 http probe"
        continue-on-error: true
        env:
          CHECK: panel
        run: |
          emit() {
            local v="${1//'%'/'%25'}"; v="${v//$'\r'/'%0D'}"; v="${v//$'\n'/'%0A'}"
            echo "::notice title=PROBE-RESULT::$CHECK: $v"
          }
          code=$(curl -sS -m 8 -o /dev/null -w "%{http_code}" "http://$HOST:8081/" 2>/dev/null || echo "000")
          code_h=$(curl -sS -m 8 -o /dev/null -w "%{http_code}" "http://$HOST:8081/healthz" 2>/dev/null || echo "000")
          echo "/ -> HTTP $code ; /healthz -> HTTP $code_h"
          emit "/=$code healthz=$code_h"
          [ "$code" != "000" ] || exit 1

      - name: "icmp ping"
        continue-on-error: true
        env:
          CHECK: ping
        run: |
          emit() {
            local v="${1//'%'/'%25'}"; v="${v//$'\r'/'%0D'}"; v="${v//$'\n'/'%0A'}"
            echo "::notice title=PROBE-RESULT::$CHECK: $v"
          }
          if ping -c 3 -W 3 "$HOST" >/dev/null 2>&1; then
            echo "ping OK"
            emit "replies"
          else
            echo "ICMP: no reply (Poate fi blocat de firewall — nu e decisiv)"
            emit "no-reply"
            exit 1
          fi

      - name: summary
        if: always()
        run: |
          echo "Vezi adnotările PROBE-RESULT ale acestui run pentru rezultatul fiecărei verificări." >> "$GITHUB_STEP_SUMMARY"
