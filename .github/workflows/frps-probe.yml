name: FRP server probe

on:
  workflow_dispatch:
    inputs:
      host:
        description: "frps host (IP sau domeniu) de verificat"
        required: true
        type: string
      ports:
        description: "porturi TCP separate prin virgulă"
        required: false
        default: "7000,25565,8081"
        type: string
  push:
    branches:
      - arena/2f9f7b9e-mrcrayfishvehiclemod
    paths:
      - .github/workflows/frps-probe.yml

permissions:
  contents: read

jobs:
  probe:
    name: Probe frps reachability
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: TCP reachability
        env:
          # On push runs there are no dispatch inputs; fall back to the known host.
          HOST: ${{ inputs.host || '140.238.218.210' }}
          PORTS: ${{ inputs.ports || '7000,25565,8081' }}
        run: |
          set -uo pipefail
          echo "Probing $HOST ($PORTS) ..."
          IFS=',' read -ra arr <<< "$PORTS"
          for p in "${arr[@]}"; do
            p="${p//[[:space:]]/}"
            [ -n "$p" ] || continue
            if timeout 6 bash -c "exec 3<>/dev/tcp/$HOST/$p" 2>/dev/null; then
              echo "PORT $p: OPEN"
            else
              echo "PORT $p: CLOSED or FILTERED"
            fi
          done

      - name: Ping
        env:
          HOST: ${{ inputs.host || '140.238.218.210' }}
        run: ping -c 3 -W 3 "$HOST" || echo "ICMP: no reply (some hosts block ping; not decisive)"

      - name: HTTP probe for web panel
        env:
          HOST: ${{ inputs.host || '140.238.218.210' }}
        run: |
          code=$(curl -sS -m 8 -o /dev/null -w "%{http_code}" "http://$HOST:8081/healthz" 2>/dev/null || echo "000")
          echo "GET http://$HOST:8081/healthz -> HTTP $code"
