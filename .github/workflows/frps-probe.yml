name: FRP server probe

on:
  workflow_dispatch:
    inputs:
      host:
        description: "frps host (IP sau domeniu) de verificat"
        required: true
        type: string
  push:
    branches:
      - arena/2f9f7b9e-mrcrayfishvehiclemod
    paths:
      - .github/workflows/frps-probe.yml

permissions:
  contents: read

env:
  HOST: ${{ github.event.inputs.host || '140.238.218.210' }}

jobs:
  probe:
    name: Probe frps reachability
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Each probe is its own always-running step so per-port results are
      # readable both in the Actions UI and via the REST API step list,
      # without needing access to log archives.
      - name: "port-7000 frps control"
        id: p7000
        continue-on-error: true
        run: |
          if timeout 6 bash -c "exec 3<>/dev/tcp/$HOST/7000" 2>/dev/null; then
            echo "PORT 7000 (frps control): OPEN"
          else
            echo "PORT 7000 (frps control): CLOSED or FILTERED"; exit 1
          fi

      - name: "minecraft-25565 server-list-ping"
        id: mcping
        continue-on-error: true
        run: |
          python3 - "$HOST" 25565 <<'PYEOF'
          import json, socket, sys

          def write_varint(v):
              out = bytearray()
              while True:
                      t = v & 0x7F
                      v >>= 7
                      if v: out.append(t | 0x80)
                      else:
                          out.append(t); break
              return bytes(out)

          def read_varint(s):
              n = 0; sh = 0
              while True:
                  b = s.recv(1)
                  if not b: raise IOError("eof")
                  n |= (b[0] & 0x7F) << sh
                  if not b[0] & 0x80: break
                  sh += 7
              return n

          host, port = sys.argv[1], int(sys.argv[2])
          try:
              s = socket.create_connection((host, port), timeout=6)
          except OSError as e:
              print(f"25565: TCP closed/filtered ({e}); no backend connected")
              sys.exit(1)
          addr = host.encode()
          hs = write_varint(0) + write_varint(47) + write_varint(len(addr)) + addr + port.to_bytes(2, "big") + write_varint(1)
          s.sendall(write_varint(len(hs)) + hs)
          s.sendall(write_varint(1) + write_varint(0))
          s.settimeout(6)
          read_varint(s); read_varint(s)
          ln = read_varint(s)
          data = b""
          while len(data) < ln:
              chunk = s.recv(ln - len(data))
              if not chunk: break
              data += chunk
          try:
              d = json.loads(data)
          except ValueError:
              print("25565: TCP open but NOT a Minecraft server (garbage response)")
              sys.exit(1)
          ver = d.get("version", {})
          pl = d.get("players", {})
          motd = d.get("description")
          if isinstance(motd, dict): motd = motd.get("text", str(motd))
          print(f"MINECRAFT ONLINE: {ver.get('name')} (protocol {ver.get('protocol')})")
          print(f"Players: {pl.get('online')}/{pl.get('max')}")
          print(f"MOTD: {str(motd)[:100]}")
          PYEOF

      - name: "panel-8081 http probe"
        id: panel
        continue-on-error: true
        run: |
          code=$(curl -sS -m 8 -o /tmp/panel-body -w "%{http_code}" "http://$HOST:8081/" 2>/dev/null || echo "000")
          echo "GET http://$HOST:8081/ -> HTTP $code"
          head -c 300 /tmp/panel-body 2>/dev/null || true
          echo
          code_h=$(curl -sS -m 8 -o /dev/null -w "%{http_code}" "http://$HOST:8081/healthz" 2>/dev/null || echo "000")
          echo "GET http://$HOST:8081/healthz -> HTTP $code_h"
          [ "$code" != "000" ]

      - name: "icmp ping"
        id: ping
        continue-on-error: true
        run: |
          ping -c 3 -W 3 "$HOST" || { echo "ICMP: no reply"; exit 1; }

      - name: summary
        if: always()
        run: |
          {
            echo "### Rezultat probe $HOST"
            echo "| Verificare | Rezultat (success = OK) |"
            echo "|---|---|"
            echo "| frps control (7000) | ${{ steps.p7000.conclusion }} |"
            echo "| minecraft SLP (25565) | ${{ steps.mcping.conclusion }} |"
            echo "| panou web HTTP (8081) | ${{ steps.panel.conclusion }} |"
            echo "| ping | ${{ steps.ping.conclusion }} |"
          } >> "$GITHUB_STEP_SUMMARY"
