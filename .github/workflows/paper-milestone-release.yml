name: Paper land vehicles milestone release

on:
  push:
    paths:
      - ".github/workflows/paper-milestone-release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag for the release (must not already exist)'
        required: true
        default: 'v1.0.0'
      title:
        description: 'Release title'
        required: true
        default: 'MrCrayfish Vehicle Plugin v1.0.0'
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name == 'arena/339da537-mrcrayfishvehiclemod'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test resource-pack build and server synchronization
        run: python3 -m unittest tools.test_build_resource_pack tools.test_configure_server_resource_pack

      - name: Build JAR and mandatory resource pack
        run: ./paper-plugin/gradlew -p paper-plugin clean build resourcePack

      - name: Verify resource pack and JAR output
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find paper-plugin/build/libs -name 'MrCrayfishVehiclePlugin-*.jar' -type f -print -quit)
          PACK="paper-plugin/build/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r38.zip"
          test -s "$JAR"
          unzip -t "$PACK"
          PACK_SHA1=$(sha1sum "$PACK" | cut -d' ' -f1)
          CONFIG_SHA1=$(sed -n 's/^[[:space:]]*sha1: *"\([0-9a-f]*\)".*/\1/p' paper-plugin/src/main/resources/config.yml)
          echo "Resource-pack SHA-1: $PACK_SHA1"
          test "$PACK_SHA1" = "$CONFIG_SHA1"
          unzip -Z1 "$PACK" > /tmp/resource-pack-entries.txt
          grep -Fxq 'LICENSE.txt' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/sports_car_body.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/sounds/entity/sports_car/engine.ogg' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/mini_bus_body.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/big_tow_bar.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/sounds/entity/mini_bus/engine.ogg' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/compact_helicopter_body.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/compact_helicopter_blades.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/compact_helicopter_tail_rotor.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/sounds/entity/vehicle/helicopter_rotor.ogg' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/sofacopter_sofa.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/sofacopter_arm.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/sofacopter_blades.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/dune_buggy_body.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/dune_buggy_handles.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/sounds/entity/bumper_car/engine.ogg' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/atv_body.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/atv_handles.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/sounds/entity/atv/engine.ogg' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/mini_bike_body.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/mini_bike_handles.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/smart_car_body.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/speed_boat_body.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/sounds/entity/speed_boat/engine.ogg' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/aluminum_boat_body.json' /tmp/resource-pack-entries.txt

      - name: Prepare immutable milestone assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          JAR=$(find paper-plugin/build/libs -name 'MrCrayfishVehiclePlugin-*.jar' -type f | head -1)
          cp "$JAR" release/MrCrayfishVehiclePlugin-Paper-1.21.4-LandVehicles.jar
          cp paper-plugin/build/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r38.zip release/
          (
            cd release
            sha256sum MrCrayfishVehiclePlugin-Paper-1.21.4-LandVehicles.jar \
              MrCrayfishVehiclePlugin-resource-pack-1.21.4-r38.zip > SHA256SUMS.txt
            sha1sum MrCrayfishVehiclePlugin-resource-pack-1.21.4-r38.zip > RESOURCE-PACK-SHA1.txt
          )

      - name: Publish immutable GitHub milestone
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'v1.0.0' }}
          TITLE: ${{ inputs.title || 'MrCrayfish Vehicle Plugin v1.0.0 (Paper 1.21.4)' }}
          PRERELEASE: ${{ inputs.prerelease || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite the immutable milestone."
            exit 1
          fi
          PRERELEASE_FLAG=()
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG=(--prerelease)
          fi
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            "${PRERELEASE_FLAG[@]}" \
            --notes-file - <<'EOF'
          Full checkpoint of the server-side Paper port of MrCrayfish's Vehicle Mod, built for vanilla clients (no Forge/mod required on the player side).

          Included vehicles (23): Go Kart, Lawn Mower, Quad Bike, Dune Buggy, Tractor, Dirt Bike, Moped, Off Roader, Sports Car, Mini Bus, Golf Cart, Jet Ski, Compact Helicopter, Sofacopter, Sports Plane, ATV, Mini Bike, Smart Car, Speed Boat, Aluminum Boat, Couch, Bumper Car, Shopping Cart.
          Included trailers (5): all original trailers with source-aligned towing/transport behaviour.

          Package contents:
          - server plugin JAR;
          - mandatory vanilla-client resource pack (models, textures, item-display geometry, and engine/ambient sounds per vehicle);
          - SHA-256 checksums for both artifacts;
          - the resource-pack SHA-1 used by the plugin's Paper resource-pack configuration.

          Verified in GitHub Actions before publishing:
          - clean Java 21 Gradle test/build;
          - non-empty plugin JAR output;
          - resource-pack ZIP integrity and SHA-1 match against the plugin's `config.yml`.

          Vanilla-client limitations (disclosed deviations from the original Forge mod):
          - players use Minecraft's standard horse-style mounted posture because Paper cannot set individual player limb angles;
          - ItemDisplays and server-side interaction rays replace Forge render and ray-trace objects;
          - a mandatory resource pack is required for the original models, textures, and sounds;
          - Couch and Sofacopter remain dependent on MrCrayfish's Furniture Mod, matching the original mod's own cross-mod dependency; the Bath vehicle is excluded (it only existed via a cross-mod dependency in the original).
          EOF
