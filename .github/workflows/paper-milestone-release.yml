name: Paper Go Kart milestone release

on:
  push:
    paths:
      - ".github/workflows/paper-milestone-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name == 'arena/339da537-mrcrayfishvehiclemod'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build JAR and mandatory resource pack
        run: ./paper-plugin/gradlew -p paper-plugin clean build resourcePack

      - name: Verify resource pack and JAR output
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find paper-plugin/build/libs -name 'MrCrayfishVehiclePlugin-*.jar' -type f -print -quit)
          PACK="paper-plugin/build/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r4.zip"
          test -s "$JAR"
          unzip -t "$PACK"
          PACK_SHA1=$(sha1sum "$PACK" | cut -d' ' -f1)
          CONFIG_SHA1=$(sed -n 's/^[[:space:]]*sha1: *"\([0-9a-f]*\)".*/\1/p' paper-plugin/src/main/resources/config.yml)
          echo "Resource-pack SHA-1: $PACK_SHA1"
          test "$PACK_SHA1" = "$CONFIG_SHA1"
          test "$PACK_SHA1" = '94c646cbf4e1812263703b1a287b925fb9a4d17a'
          unzip -Z1 "$PACK" > /tmp/resource-pack-entries.txt
          grep -Fxq 'LICENSE.txt' /tmp/resource-pack-entries.txt

      - name: Prepare immutable milestone assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          JAR=$(find paper-plugin/build/libs -name 'MrCrayfishVehiclePlugin-*.jar' -type f | head -1)
          cp "$JAR" release/MrCrayfishVehiclePlugin-Paper-1.21.4-GoKart.jar
          cp paper-plugin/build/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r4.zip release/
          (
            cd release
            sha256sum MrCrayfishVehiclePlugin-Paper-1.21.4-GoKart.jar \
              MrCrayfishVehiclePlugin-resource-pack-1.21.4-r4.zip > SHA256SUMS.txt
            sha1sum MrCrayfishVehiclePlugin-resource-pack-1.21.4-r4.zip > RESOURCE-PACK-SHA1.txt
          )

      - name: Publish immutable GitHub milestone
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="paper-go-kart-milestone-2026-10-06"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite the immutable milestone."
            exit 1
          fi
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "Paper 1.21.4 Go Kart validated milestone — 2026-10-06" \
            --prerelease \
            --notes-file - <<'EOF'
          Immutable backup of the player-tested Go Kart milestone for Paper 1.21.4 and Java 21.

          Included:
          - server plugin JAR;
          - mandatory vanilla-client resource pack r4;
          - SHA-256 checksums for both artifacts;
          - the resource pack SHA-1 used by Paper configuration.

          Verified in GitHub Actions:
          - clean Java 21 compile and Gradle check;
          - JAR structure and required plugin resources;
          - resource-pack ZIP integrity, JSON parsing, required assets, license, and exact configured SHA-1.

          Scope and known limitations:
          - Go Kart prototype only; the remaining mod vehicles are not ported yet;
          - requires the attached mandatory resource pack;
          - vanilla clients use Minecraft's standard riding limb pose because Paper cannot set individual player limb angles;
          - full-block step height is an intentional server requirement and differs from the original 0.625-block step height.
          EOF
