name: Paper land vehicles milestone release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name == 'arena/339da537-mrcrayfishvehiclemod'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test resource-pack build and server synchronization
        run: python3 -m unittest tools.test_build_resource_pack tools.test_configure_server_resource_pack

      - name: Build JAR and mandatory resource pack
        run: ./paper-plugin/gradlew -p paper-plugin clean build resourcePack

      - name: Verify resource pack and JAR output
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find paper-plugin/build/libs -name 'MrCrayfishVehiclePlugin-*.jar' -type f -print -quit)
          PACK="paper-plugin/build/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r25.zip"
          test -s "$JAR"
          unzip -t "$PACK"
          PACK_SHA1=$(sha1sum "$PACK" | cut -d' ' -f1)
          CONFIG_SHA1=$(sed -n 's/^[[:space:]]*sha1: *"\([0-9a-f]*\)".*/\1/p' paper-plugin/src/main/resources/config.yml)
          echo "Resource-pack SHA-1: $PACK_SHA1"
          test "$PACK_SHA1" = "$CONFIG_SHA1"
          unzip -Z1 "$PACK" > /tmp/resource-pack-entries.txt
          grep -Fxq 'LICENSE.txt' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/sports_car_body.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/sounds/entity/sports_car/engine.ogg' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/mini_bus_body.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/big_tow_bar.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/sounds/entity/mini_bus/engine.ogg' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/compact_helicopter_body.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/compact_helicopter_blades.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/items/compact_helicopter_tail_rotor.json' /tmp/resource-pack-entries.txt
          grep -Fxq 'assets/vehicle/sounds/entity/vehicle/helicopter_rotor.ogg' /tmp/resource-pack-entries.txt

      - name: Prepare immutable milestone assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          JAR=$(find paper-plugin/build/libs -name 'MrCrayfishVehiclePlugin-*.jar' -type f | head -1)
          cp "$JAR" release/MrCrayfishVehiclePlugin-Paper-1.21.4-LandVehicles.jar
          cp paper-plugin/build/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r25.zip release/
          (
            cd release
            sha256sum MrCrayfishVehiclePlugin-Paper-1.21.4-LandVehicles.jar \
              MrCrayfishVehiclePlugin-resource-pack-1.21.4-r25.zip > SHA256SUMS.txt
            sha1sum MrCrayfishVehiclePlugin-resource-pack-1.21.4-r25.zip > RESOURCE-PACK-SHA1.txt
          )

      - name: Publish immutable GitHub milestone
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="paper-land-vehicles-milestone-2026-10-08-r25"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite the immutable milestone."
            exit 1
          fi
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "Paper 1.21.4 land vehicles milestone r25 — 2026-10-08" \
            --prerelease \
            --notes-file - <<'EOF'
          Immutable backup of the validated land-vehicle checkpoint for Paper 1.21.4 and Java 21.

          Included:
          - server plugin JAR with ten land vehicles, the Jet Ski, Sports Plane, Compact Helicopter, and all five original trailers;
          - mandatory vanilla-client resource pack r25, including the complete Compact Helicopter and Sports Plane rigs, rotor/control-surface animation, released aquatic physics, and source audio;
          - SHA-256 checksums for both artifacts;
          - the resource-pack SHA-1 used by Paper configuration.

          Verified in GitHub Actions:
          - clean Java 21 Gradle test/build;
          - non-empty plugin JAR output;
          - resource-pack ZIP integrity, license, Sports Car assets, and configured SHA-1.

          Vanilla-client limitations:
          - players use Minecraft's standard horse-style mounted posture because Paper cannot set individual player limb angles;
          - ItemDisplays and server-side interaction rays replace Forge render and ray-trace objects;
          - a mandatory resource pack is required for the original models, textures, and sounds.
          EOF
