name: HidenCloud info (stadiu panou + adresa)

on:
  push:
    branches:
      - arena/2f9f7b9e-mrcrayfishvehiclemod
    paths:
      - ".github/workflows/hidencloud-info.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PANEL: https://freepanel.hidencloud.com
  SERVER_ID: a4e04808

jobs:
  info:
    name: Citește alocarea (IP:port) și starea
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Info
        env:
          K3Y: ${{ secrets.HIDENCLOUD_API_KEY }}
        run: |
          [ -n "${K3Y:-}" ] || { echo "::error::lipsește HIDENCLOUD_API_KEY"; exit 1; }
          AUTH="Authorization: Bearer $K3Y"
          B=$(curl -sS -m 15 -o /tmp/b.txt -w "%{http_code}" -H "$AUTH" -H "Accept: application/json" "$PANEL/api/client/servers/$SERVER_ID"); echo "HTTP=$B"; head -c 300 /tmp/b.txt; S=$(cat /tmp/b.txt)
          NAME=$(echo "$S" | jq -r '.attributes.name // "?"')
          ADDR=$(echo "$S" | jq -r '.attributes.relationships.allocations.data[]? | select(.attributes.is_default==true) | "\(.attributes.ip_alias // .attributes.ip):\(.attributes.port)"' | head -1)
          [ -n "$ADDR" ] || ADDR=$(echo "$S" | jq -r '.attributes.relationships.allocations.data[0]? | "\(.attributes.ip_alias // .attributes.ip):\(.attributes.port)"')
          R=$(curl -fsS -m 15 -H "$AUTH" -H 'Accept: application/json' "$PANEL/api/client/servers/$SERVER_ID/resources")
          ST=$(echo "$R" | jq -r '.attributes.current_state // "?"')
          echo "::notice title=HC-INFO::server $NAME | adresa jocului: $ADDR | stare: $ST"
          echo "name=$NAME addr=$ADDR state=$ST"
