name: Horizon mod masini (build oficial, ARM64)

# Modul nostru e un bundle nativ Horizon (horizon-mixin.toml + .rs), construit cu
# uneltele oficiale din horizon-rust/horizon-mods:
#   1. `native.py build vehicle` descarca sursa Horizon la commit-ul din compatibility.json,
#      construieste horizon-mixins, aplica bundle-ul si compileaza jocul;
#   2. recompilam in profil release si fara sunet, pentru serverul de pe panel;
#   3. urcam binarul ca `horizon/horizon-engine-mod` si in release-ul `horizon-engine-mod`.
#
# Lansatorul il activeaza doar daca e un ELF aarch64 valid, si revine singur la engine-ul
# normal daca modulul crapa la pornire.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/horizon-engine-mod.trigger"
      - "horizon/engine-mod/**"

permissions:
  contents: write

env:
  SFTP_HOST: jacob.hidencloud.com
  SFTP_PORT: "2022"
  SFTP_USER: mariusuke-184939.d496911d

jobs:
  build:
    name: Build mod + engine (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Clonez horizon-mods (uneltele oficiale)
        run: |
          set +e
          git clone --depth 1 https://github.com/horizon-rust/horizon-mods.git horizon-mods > clone.log 2>&1
          echo "clone exit=$?" >> clone.log
          tail -3 clone.log

      - name: Pun modul in registrul local
        run: |
          set -euo pipefail
          rm -rf horizon-mods/native/vehicle
          cp -r horizon/engine-mod horizon-mods/native/vehicle
          ls horizon-mods/native/vehicle horizon-mods/native/vehicle/mixins/vehicle

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            horizon-mods/native/target/cargo

      - name: Aplic bundle-ul si compilez (uneltele Horizon)
        working-directory: horizon-mods
        run: |
          set +e
          NATIVE_NO_DEFAULT_FEATURES=1 python3 native/tools/native.py build vehicle > ../native-build.log 2>&1
          echo "exit=$?" >> ../native-build.log
          tail -30 ../native-build.log

      - name: Recompilez in release (server, fara sunet)
        run: |
          set +e
          STAGE=horizon-mods/native/target/stage/vehicle
          if [ ! -d "$STAGE" ]; then echo "lipseste stage-ul" > build.log; echo "exit=1" >> build.log; exit 0; fi
          cd "$STAGE"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/horizon-mods/native/target/cargo" \
            cargo build --release --locked -p horizon-client --bin horizon-client --no-default-features > "$GITHUB_WORKSPACE/build.log" 2>&1
          echo "exit=$?" >> "$GITHUB_WORKSPACE/build.log"
          tail -25 "$GITHUB_WORKSPACE/build.log"

      - name: Pachetez
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          BIN=horizon-mods/native/target/cargo/release/horizon-client
          if [ -f "$BIN" ]; then
            cp "$BIN" out/horizon-engine-mod
            strip out/horizon-engine-mod 2>/dev/null || true
            chmod +x out/horizon-engine-mod
            file out/horizon-engine-mod
            ls -lh out/horizon-engine-mod
          else
            echo "fara binar"
          fi

      - name: Urc pe panel (doar daca build-ul a reusit)
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f out/horizon-engine-mod ]; then echo "build fara binar, sar peste upload"; exit 0; fi
          install -m 600 hidencloud/keys/arena_hc_ed25519 /tmp/hc_key
          sftp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 \
            -o BatchMode=yes -i /tmp/hc_key -P "$SFTP_PORT" "$SFTP_USER@$SFTP_HOST" <<'BATCH'
          put out/horizon-engine-mod horizon/horizon-engine-mod
          chmod 755 horizon/horizon-engine-mod
          ls -l horizon/horizon-engine-mod
          BATCH

      - name: Raport in repo
        if: always()
        run: |
          set +e
          mkdir -p horizon
          {
            echo "# modul de masini — ultima incercare (unelte oficiale)"
            echo
            echo '## native.py build'; tail -40 native-build.log 2>/dev/null
            echo; echo '## release'; tail -30 build.log 2>/dev/null
            echo; echo '## binar'; ls -lh out/horizon-engine-mod 2>/dev/null
          } > horizon/_engine-mod-build.md
          git config user.name arena-agent
          git config user.email arena-agent@users.noreply.github.com
          git add -f horizon/_engine-mod-build.md
          git commit -m "raport mod masini [skip ci]" >/dev/null 2>&1
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" >/dev/null 2>&1 || true
          git push origin "HEAD:$GITHUB_REF_NAME" >/dev/null 2>&1 || true

      - name: Public in release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f out/horizon-engine-mod ]; then echo "nimic de publicat"; exit 0; fi
          TAG=horizon-engine-mod
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/horizon-engine-mod --clobber
          else
            gh release create "$TAG" out/horizon-engine-mod \
              --title "Horizon engine cu modul de masini (ARM64)" \
              --notes "Mod nativ construit cu horizon-mods/native.py pe horizon-rust/horizon, profil release, fara sunet."
          fi
