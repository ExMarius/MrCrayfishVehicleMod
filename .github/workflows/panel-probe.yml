name: "Panel probe (login, status, logs, comanda, butoane)"

on:
  push:
    branches:
      - arena/2f9f7b9e-mrcrayfishvehiclemod
    paths:
      - ".github/workflows/panel-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    name: Testez panoul cap-coada din exterior
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Healthz + login + status + logs + comanda + butoane
        env:
          ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
        run: |
          set +e
          B="http://$ORACLE_VM_HOST:8081"
          : > /tmp/probe-results.txt
          RESULT() { # $1=nivel $2=mesaj — scriem ÎN FIȘIER (l-am citit apoi din repo)
            echo "[$1] $2" | tee -a /tmp/probe-results.txt
          }
          emit() {
            local v="${2//'%'/'%25'}"; v="${v//$'\r'/'%0D'}"; v="${v//$'\n'/'%0A'}"
            echo "::${1}title=PANEL::${v:0:700}"
            RESULT "$1" "${2:0:700}"
          }
          api() { # metoda cale json_extra...
            local m="$1" p="$2"; shift 2
            curl -sS -m 15 -X "$m" "$B$p" -H 'Content-Type: application/json' \
                 -H "Cookie: $COOKIE" -H "X-CSRF-Token: $CSRF" "$@" -w '\nHTTP_CODE=%{http_code}'
          }

          H=$(curl -sS -m 10 -o /dev/null -w '%{http_code}' "$B/healthz")
          [ "$H" = 200 ] && emit notice "healthz OK" || { emit error "/healthz: $H — panoul nu raspunde deloc"; exit 1; }

          L=$(curl -sS -m 10 -X POST "$B/api/login" -H 'Content-Type: application/json' \
               -d '{"username":"admin","password":"12345"}' \
               -D /tmp/hdrs -w '\nHTTP_CODE=%{http_code}')
          CODE=$(echo "$L" | grep -o 'HTTP_CODE=[0-9]*' | cut -d= -f2)
          if [ "$CODE" != 200 ]; then emit error "login: HTTP $CODE (parola 12345 nu mai e buna?)"; exit 1; fi
          CSRF=$(echo "$L" | sed -n 's/.*"csrf": *"\([^"]*\)".*/\1/p' | head -1)
          COOKIE=$(grep -i '^set-cookie:' /tmp/hdrs | sed -n 's/.*\(mcv_session=[^;]*\).*/\1/p' | head -1 | tr -d '\r')
          emit notice "login OK (sesiune+csrf)"

          S=$(api GET /api/status); CODE=$(echo "$S" | grep -o 'HTTP_CODE=[0-9]*' | cut -d= -f2)
          STATE_LINE=$(echo "$S" | grep -oE '"(server|pid|maxPlayers)"[^,}]*' | tr '\n' ' ')
          emit notice "api/status: HTTP $CODE | $STATE_LINE"

          G=$(api GET /api/logs); CODE=$(echo "$G" | grep -o 'HTTP_CODE=[0-9]*' | cut -d= -f2)
          LOGINFO=$(echo "$G" | sed '/HTTP_CODE=/d' | jq -r '"octeti=\(.logs|length) ultima=\(.logs | rtrimstr("\n") | split("\n") | last | .[0:120])"' 2>/dev/null)
          emit notice "api/logs(conșola live): HTTP $CODE | $LOGINFO"

          C=$(api POST /api/command -d '{"command":"list"}'); CODE=$(echo "$C" | grep -o 'HTTP_CODE=[0-9]*' | cut -d= -f2)
          MSG=$(echo "$C" | grep -oE '"(ok|message|error)": *[^,}]*(, ?"[^"]*": *"[^"]*")?' | head -3 | tr '\n' ' ')
          emit notice "api/comanda(list): HTTP $CODE | $MSG"
          if [ "$CODE" != 200 ]; then emit error "BARA DE COMANDA RUPE: HTTP $CODE $MSG"; fi

          R=$(api POST /api/control -d '{"action":"restart"}'); CODE=$(echo "$R" | grep -o 'HTTP_CODE=[0-9]*' | cut -d= -f2)
          MSG=$(echo "$R" | head -1 | cut -c1-200)
          emit notice "api/control(restart): HTTP $CODE | $MSG"
          if [ "$CODE" != 202 ]; then emit error "BUTOANELE RUP: HTTP $CODE $MSG"; fi

          echo "astept serverul sa se ridice (max 6 min)…"
          OK=0
          for i in $(seq 1 24); do
            sleep 15
            S=$(api GET /api/status)
            ST=$(echo "$S" | grep -o '"server": *"[a-z]*"' | head -1)
            echo "  [$i] $ST"
            echo "$ST" | grep -q running && { OK=1; break; }
          done
          if [ "$OK" = 1 ]; then
            emit notice "dupa restart: server=running → BUTOANE OK"
            C=$(api POST /api/command -d '{"command":"say test din probe"}')
            CODE=$(echo "$C" | grep -o 'HTTP_CODE=[0-9]*' | cut -d= -f2)
            [ "$CODE" = 200 ] && emit notice "comanda post-restart: OK" || emit error "comanda post-restart: HTTP $CODE"
          else
            emit error "serverul nu a revenit running in 6 min dupa restart"
          fi
          echo "done-marker" >> /tmp/probe-results.txt

      - name: Comit rezultatul probei in repo (il citesc direct din git)
        if: always()
        run: |
          git config user.name "panel-probe[bot]"
          git config user.email "panel-probe[bot]@users.noreply.github.com"
          cp /tmp/probe-results.txt probe-result.txt 2>/dev/null || echo "[error] step-ul principal nu a lasat rezultate / fisier gol" > probe-result.txt
          git add probe-result.txt
          git commit -m "Probe result [skip ci]" || true
          git push origin "HEAD:arena/2f9f7b9e-mrcrayfishvehiclemod" || echo "::warning::push rezultat esuat"
