name: Paper plugin

on:
  push:
    paths:
      - "paper-plugin/**"
      - "tools/build_resource_pack.py"
      - "src/main/resources/assets/vehicle/**"
      - "src/main/resources/vehicle_mod.png"
      - ".github/workflows/paper-plugin.yml"
      - ".github/falix-deploy-request"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build plugin and resource pack
        run: ./paper-plugin/gradlew -p paper-plugin clean build resourcePack

      - name: Report test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for report in pathlib.Path("paper-plugin/build/test-results/test").glob("TEST-*.xml"):
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  for failure in case.findall("failure") + case.findall("error"):
                      message = (failure.get("message") or failure.text or "Test failed").replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{message}")
          PY

      - name: Verify resource pack
        run: |
          PACK="paper-plugin/build/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r6.zip"
          unzip -t "$PACK"
          PACK_SHA1=$(sha1sum "$PACK" | cut -d' ' -f1)
          CONFIG_SHA1=$(sed -n 's/^[[:space:]]*sha1: *"\([0-9a-f]*\)".*/\1/p' paper-plugin/src/main/resources/config.yml)
          echo "Resource-pack SHA-1: $PACK_SHA1"
          test "$PACK_SHA1" = "$CONFIG_SHA1"
          unzip -l "$PACK" LICENSE.txt | grep -q LICENSE.txt

      - name: Publish prototype release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH_HEAD=$(git ls-remote --heads origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [ "$GITHUB_SHA" != "$BRANCH_HEAD" ]; then
            echo "Skipping release upload from stale commit $GITHUB_SHA (branch head is $BRANCH_HEAD)."
            exit 0
          fi
          TAG="vehicle-plugin-prototype-v0.1.0"
          JAR=$(find paper-plugin/build/libs -name 'MrCrayfishVehiclePlugin-*.jar' -type f | head -1)
          PACK="paper-plugin/build/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r6.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" "$PACK" --clobber
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$TAG" --target "$GITHUB_SHA" \
              --title "Vehicle Plugin land vehicles prototype v0.1.0 (Paper 1.21.4)" \
              --notes "Server-side Go Kart, Lawn Mower, and Quad Bike checkpoint for Paper 1.21.4. Requires the attached resource pack."
          else
            gh release create "$TAG" "$JAR" "$PACK" \
              --target "$GITHUB_SHA" \
              --title "Vehicle Plugin land vehicles prototype v0.1.0 (Paper 1.21.4)" \
              --notes "Server-side Go Kart, Lawn Mower, and Quad Bike checkpoint for Paper 1.21.4. Requires the attached resource pack." \
              --prerelease
          fi

      - name: One-time encrypted FalixNodes deployment
        if: hashFiles('.github/falix-deploy-request') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="vehicle-plugin-prototype-v0.1.0"
          CLEAN_NOTES="Server-side Go Kart, Lawn Mower, and Quad Bike checkpoint for Paper 1.21.4. Requires the attached resource pack."
          cleanup() {
            gh release edit "$TAG" --notes "$CLEAN_NOTES" >/dev/null 2>&1 || true
            rm -f /tmp/falix-deploy-private.pem /tmp/falix-deploy-public.pem /tmp/falix-deploy-payload.bin
          }
          trap cleanup EXIT

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out /tmp/falix-deploy-private.pem 2>/dev/null
          openssl pkey -in /tmp/falix-deploy-private.pem -pubout \
            -out /tmp/falix-deploy-public.pem 2>/dev/null
          PUBLIC_KEY=$(base64 -w0 /tmp/falix-deploy-public.pem)
          gh release edit "$TAG" --notes "${CLEAN_NOTES}

          FALIX_DEPLOY_PUBLIC_KEY=${PUBLIC_KEY}
          FALIX_DEPLOY_CIPHERTEXT=PENDING" >/dev/null

          CIPHERTEXT="PENDING"
          for _ in $(seq 1 180); do
            CIPHERTEXT=$(gh release view "$TAG" --json body --jq \
              '.body | capture("FALIX_DEPLOY_CIPHERTEXT=(?<value>[^\\n]+)").value' 2>/dev/null || true)
            if [ -n "$CIPHERTEXT" ] && [ "$CIPHERTEXT" != "PENDING" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$CIPHERTEXT" ] || [ "$CIPHERTEXT" = "PENDING" ]; then
            echo "Timed out waiting for the encrypted one-time deployment payload."
            exit 1
          fi

          printf '%s' "$CIPHERTEXT" | base64 -d | \
            openssl pkeyutl -decrypt \
              -inkey /tmp/falix-deploy-private.pem \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256 \
              -out /tmp/falix-deploy-payload.bin
          HOST=$(jq -r .host /tmp/falix-deploy-payload.bin)
          PORT=$(jq -r .port /tmp/falix-deploy-payload.bin)
          USERNAME=$(jq -r .username /tmp/falix-deploy-payload.bin)
          export SSHPASS
          SSHPASS=$(jq -r .password /tmp/falix-deploy-payload.bin)
          rm -f /tmp/falix-deploy-payload.bin

          sudo apt-get update -qq
          sudo apt-get install --yes --quiet sshpass
          JAR=$(find paper-plugin/build/libs -name 'MrCrayfishVehiclePlugin-*.jar' -type f | head -1)
          CONFIG="paper-plugin/src/main/resources/config.yml"
          sshpass -e sftp \
            -oBatchMode=no \
            -oPreferredAuthentications=password \
            -oPubkeyAuthentication=no \
            -oStrictHostKeyChecking=accept-new \
            -oConnectTimeout=20 \
            -P "$PORT" \
            "${USERNAME}@${HOST}" <<EOF
          -mkdir plugins
          -rm plugins/MrCrayfishVehiclePlugin.jar.uploading
          put "$JAR" plugins/MrCrayfishVehiclePlugin.jar.uploading
          -rm plugins/MrCrayfishVehiclePlugin.jar
          -rm plugins/MrCrayfishVehiclePlugin-0.1.0-SNAPSHOT.jar
          rename plugins/MrCrayfishVehiclePlugin.jar.uploading plugins/MrCrayfishVehiclePlugin.jar
          -mkdir plugins/MrCrayfishVehiclePlugin
          put "$CONFIG" plugins/MrCrayfishVehiclePlugin/config.yml.uploading
          -rm plugins/MrCrayfishVehiclePlugin/config.yml
          rename plugins/MrCrayfishVehiclePlugin/config.yml.uploading plugins/MrCrayfishVehiclePlugin/config.yml
          ls -l plugins/MrCrayfishVehiclePlugin.jar
          ls -l plugins/MrCrayfishVehiclePlugin/config.yml
          EOF
          unset SSHPASS
          echo "FalixNodes plugin upload completed."

      - name: Upload deliverables
        uses: actions/upload-artifact@v5
        with:
          name: MrCrayfishVehiclePlugin
          if-no-files-found: error
          path: |
            paper-plugin/build/libs/MrCrayfishVehiclePlugin-*.jar
            paper-plugin/build/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r6.zip
