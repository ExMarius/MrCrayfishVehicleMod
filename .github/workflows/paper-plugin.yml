name: Paper plugin

on:
  push:
    paths:
      - "paper-plugin/**"
      - "tools/build_resource_pack.py"
      - "tools/test_build_resource_pack.py"
      - "tools/configure_server_resource_pack.py"
      - "tools/test_configure_server_resource_pack.py"
      - "tools/test_fresh_paper_server.sh"
      - "tools/source_assets/**"
      - "src/main/resources/assets/vehicle/**"
      - "src/main/resources/vehicle_mod.png"
      - ".github/workflows/paper-plugin.yml"
      - ".github/falix-deploy-request"
  workflow_dispatch:
    inputs:
      mode:
        description: "build = build+test; sftp = doar urca JAR-ul din branch pe server"
        default: "build"
      sftpHost:
        description: "SFTP host (modul sftp)"
        default: ""
      sftpPort:
        description: "SFTP port (modul sftp)"
        default: "22"
      sftpUser:
        description: "SFTP user (modul sftp)"
        default: ""
      sftpPassword:
        description: "SFTP password (modul sftp)"
        default: ""
      doDeploy:
        description: "api-probe: urca JAR + restart (false = doar citeste starea)"
        default: "true"
      sftpTarget:
        description: "Folderul de pluginuri pe server (modul sftp)"
        default: "plugins"
      panelUrl:
        description: "URL panel (ex. https://client.falixnodes.net) - optional, pentru restart automat"
        default: ""
      panelServerId:
        description: "ID-ul serverului in panel (ex. 3500167) - optional"
        default: ""
      panelApiKey:
        description: "Cheia API din panel (optional, doar pentru restart automat)"
        default: ""
      probe:
        description: "Doar probe de compilare (fara build, test, deploy)"
        type: boolean
        default: false
      paperApi:
        description: "Versiunea paper-api (build si probe)"
        default: "26.3.build.259-stable"
      javaVersion:
        description: "Toolchain Java (build si probe)"
        default: "25"

permissions:
  contents: write

concurrency:
  group: paper-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: inputs.probe != true && inputs.mode != 'sftp'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java ${{ inputs.javaVersion || '25' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.javaVersion || '25' }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Sincronizeaza SHA-1 din config cu pack-ul 26.3
        run: |
          set -euo pipefail
          python3 tools/build_resource_pack.py --output /tmp/pack-26.3.zip --pack-format 97
          SHA1=$(sha1sum /tmp/pack-26.3.zip | cut -d' ' -f1)
          echo "SHA-1 pack 26.3: $SHA1"
          python3 - "$SHA1" <<'PY'
          import re, sys, pathlib
          path = pathlib.Path("paper-plugin/src/main/resources/config.yml")
          text = path.read_text()
          text = re.sub(r'(?m)^(\s*sha1: *").*(")$', r'\g<1>' + sys.argv[1] + r'\g<2>', text)
          path.write_text(text)
          PY
          grep -n 'sha1:' paper-plugin/src/main/resources/config.yml

      - name: Test resource-pack build and server synchronization
        run: python3 -m unittest tools.test_build_resource_pack tools.test_configure_server_resource_pack tools.test_wheels_preset

      - name: Build plugin and resource pack
        env:
          PAPER_API: ${{ inputs.paperApi || '26.3.build.259-stable' }}
          JAVA_VERSION: ${{ inputs.javaVersion || '25' }}
        run: |
          set -o pipefail
          ./paper-plugin/gradlew -p paper-plugin clean build resourcePack \
            -PpaperApi="$PAPER_API" -PjavaVersion="$JAVA_VERSION" 2>&1 | tee /tmp/build.log

      - name: Report test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for report in pathlib.Path("paper-plugin/build/test-results/test").glob("TEST-*.xml"):
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  for failure in case.findall("failure") + case.findall("error"):
                      message = (failure.get("message") or failure.text or "Test failed").replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{message}")
          PY

      - name: Verify resource pack
        run: |
          PACK="paper-plugin/build/MrCrayfishVehiclePlugin-resource-pack-26.3-r39.zip"
          unzip -t "$PACK"
          PACK_SHA1=$(sha1sum "$PACK" | cut -d' ' -f1)
          CONFIG_SHA1=$(sed -n 's/^[[:space:]]*sha1: *"\([0-9a-f]*\)".*/\1/p' paper-plugin/src/main/resources/config.yml)
          echo "Resource-pack SHA-1: $PACK_SHA1"
          test "$PACK_SHA1" = "$CONFIG_SHA1"
          unzip -l "$PACK" LICENSE.txt | grep -q LICENSE.txt
          unzip -l "$PACK" assets/vehicle/textures/item/fluid_trailer_logo.png | grep -q fluid_trailer_logo.png
          unzip -p "$PACK" assets/vehicle/models/item/fluid_trailer_body.json | \
            grep -q 'vehicle:item/fluid_trailer_logo'
          unzip -l "$PACK" assets/vehicle/items/fuel_door_closed.json | grep -q fuel_door_closed.json
          unzip -l "$PACK" assets/vehicle/items/small_fuel_door_closed.json | grep -q small_fuel_door_closed.json
          unzip -l "$PACK" assets/vehicle/items/key_hole.json | grep -q key_hole.json
          unzip -l "$PACK" assets/vehicle/items/moped_body.json | grep -q moped_body.json
          unzip -l "$PACK" assets/vehicle/items/moped_handles.json | grep -q moped_handles.json
          unzip -l "$PACK" assets/vehicle/items/moped_mud_guard.json | grep -q moped_mud_guard.json
          unzip -l "$PACK" assets/vehicle/items/moped_stock_seat.json | grep -q moped_stock_seat.json
          unzip -l "$PACK" assets/vehicle/items/moped_stock_tray.json | grep -q moped_stock_tray.json
          unzip -l "$PACK" assets/vehicle/items/moped_stock_front_light.json | grep -q moped_stock_front_light.json
          unzip -l "$PACK" assets/vehicle/sounds/entity/moped/engine.ogg | grep -q engine.ogg
          unzip -l "$PACK" assets/vehicle/items/off_roader_body.json | grep -q off_roader_body.json
          unzip -l "$PACK" assets/vehicle/models/item/off_roader_body.json | grep -q off_roader_body.json
          unzip -l "$PACK" assets/vehicle/textures/item/off_roader_spring.png | grep -q off_roader_spring.png
          unzip -l "$PACK" assets/vehicle/textures/item/off_roader_grill.png | grep -q off_roader_grill.png
          unzip -l "$PACK" assets/vehicle/textures/item/off_roader_logo.png | grep -q off_roader_logo.png
          unzip -l "$PACK" assets/vehicle/sounds/entity/jet_ski/engine.ogg | grep -q engine.ogg
          unzip -l "$PACK" assets/vehicle/items/sports_car_body.json | grep -q sports_car_body.json
          unzip -l "$PACK" assets/vehicle/items/sports_car_hood.json | grep -q sports_car_hood.json
          unzip -l "$PACK" assets/vehicle/items/sports_car_left_door.json | grep -q sports_car_left_door.json
          unzip -l "$PACK" assets/vehicle/items/sports_car_right_door.json | grep -q sports_car_right_door.json
          unzip -l "$PACK" assets/vehicle/items/sports_car_boot.json | grep -q sports_car_boot.json
          unzip -l "$PACK" assets/vehicle/items/sports_car_dashboard.json | grep -q sports_car_dashboard.json
          unzip -l "$PACK" assets/vehicle/items/sports_car_roof.json | grep -q sports_car_roof.json
          unzip -l "$PACK" assets/vehicle/items/sports_car_seat.json | grep -q sports_car_seat.json
          unzip -l "$PACK" assets/vehicle/items/sports_car_steering_wheel.json | grep -q sports_car_steering_wheel.json
          unzip -l "$PACK" assets/vehicle/sounds/entity/sports_car/engine.ogg | grep -q engine.ogg
          unzip -l "$PACK" assets/vehicle/sounds/entity/vehicle/door/open.ogg | grep -q open.ogg
          unzip -l "$PACK" assets/vehicle/sounds/entity/vehicle/hood/open.ogg | grep -q open.ogg
          unzip -l "$PACK" assets/vehicle/items/mini_bus_body.json | grep -q mini_bus_body.json
          unzip -l "$PACK" assets/vehicle/items/mini_bus_stock_roof.json | grep -q mini_bus_stock_roof.json
          unzip -l "$PACK" assets/vehicle/items/mini_bus_left_door.json | grep -q mini_bus_left_door.json
          unzip -l "$PACK" assets/vehicle/items/mini_bus_sliding_door.json | grep -q mini_bus_sliding_door.json
          unzip -l "$PACK" assets/vehicle/items/big_tow_bar.json | grep -q big_tow_bar.json
          unzip -l "$PACK" assets/vehicle/sounds/entity/mini_bus/engine.ogg | grep -q engine.ogg
          unzip -l "$PACK" assets/vehicle/items/compact_helicopter_body.json | grep -q compact_helicopter_body.json
          unzip -l "$PACK" assets/vehicle/items/compact_helicopter_blades.json | grep -q compact_helicopter_blades.json
          unzip -l "$PACK" assets/vehicle/items/compact_helicopter_joystick.json | grep -q compact_helicopter_joystick.json
          unzip -l "$PACK" assets/vehicle/items/compact_helicopter_seat.json | grep -q compact_helicopter_seat.json
          unzip -l "$PACK" assets/vehicle/items/compact_helicopter_tail_rotor.json | grep -q compact_helicopter_tail_rotor.json
          unzip -l "$PACK" assets/vehicle/sounds/entity/vehicle/helicopter_rotor.ogg | grep -q helicopter_rotor.ogg
          unzip -l "$PACK" assets/vehicle/items/sofacopter_sofa.json | grep -q sofacopter_sofa.json
          unzip -l "$PACK" assets/vehicle/items/sofacopter_arm.json | grep -q sofacopter_arm.json
          unzip -l "$PACK" assets/vehicle/items/sofacopter_blades.json | grep -q sofacopter_blades.json
          unzip -l "$PACK" assets/vehicle/items/dune_buggy_body.json | grep -q dune_buggy_body.json
          unzip -l "$PACK" assets/vehicle/items/dune_buggy_handles.json | grep -q dune_buggy_handles.json
          unzip -l "$PACK" assets/vehicle/sounds/entity/bumper_car/engine.ogg | grep -q engine.ogg
          unzip -l "$PACK" assets/vehicle/items/atv_body.json | grep -q atv_body.json
          unzip -l "$PACK" assets/vehicle/items/atv_handles.json | grep -q atv_handles.json
          unzip -l "$PACK" assets/vehicle/sounds/entity/atv/engine.ogg | grep -q engine.ogg
          unzip -l "$PACK" assets/vehicle/items/mini_bike_body.json | grep -q mini_bike_body.json
          unzip -l "$PACK" assets/vehicle/items/mini_bike_handles.json | grep -q mini_bike_handles.json
          unzip -l "$PACK" assets/vehicle/items/smart_car_body.json | grep -q smart_car_body.json
          unzip -l "$PACK" assets/vehicle/items/speed_boat_body.json | grep -q speed_boat_body.json
          unzip -l "$PACK" assets/vehicle/sounds/entity/speed_boat/engine.ogg | grep -q engine.ogg
          unzip -l "$PACK" assets/vehicle/items/aluminum_boat_body.json | grep -q aluminum_boat_body.json

      - name: Raporteaza esecul build-ului pe commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "### Build esuat"
            echo ""
            echo "Commit: \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo '```'
            grep -E "(FAILED|error:|e: |What went wrong|Execution failed|expected|Assertion)" /tmp/build.log 2>/dev/null | head -n 40 \
              || tail -n 40 /tmp/build.log 2>/dev/null || echo "fara log"
            echo '```'
          } > /tmp/err.md
          head -c 60000 /tmp/err.md > /tmp/err_cut.md
          gh api --method POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@/tmp/err_cut.md || true

      - name: Test completely fresh Paper server
        env:
          PAPER_API: ${{ inputs.paperApi || '26.3.build.259-stable' }}
        run: |
          MC_VERSION="${PAPER_API%%.build*}"
          MC_VERSION="${MC_VERSION%%-*}"
          echo "Testez pe Paper $MC_VERSION"
          JAR=$(find paper-plugin/build/libs -name 'MrCrayfishVehiclePlugin-*.jar' -type f | head -1)
          MC_VERSION="$MC_VERSION" tools/test_fresh_paper_server.sh "$JAR"

      # Ciclul AJ.1: RELEASE-UL are UN SINGUR PROPRIETAR - workflow-ul de deploy
      # HidenCloud (hidencloud-sftp.yml). Acesta din urma urca JAR-ul + pack-ul +
      # muta tag-ul, asta in acelasi job -> ZERO race concurent. Acest workflow
      # (paper-plugin.yml) ramane strict: build + teste (CI), nimic pe release.
      - name: Deploy to FalixNodes from repository secrets
        if: hashFiles('.github/falix-deploy-request') != ''
        env:
          FALIX_SFTP_HOST: ${{ secrets.FALIX_SFTP_HOST }}
          FALIX_SFTP_PORT: ${{ secrets.FALIX_SFTP_PORT }}
          FALIX_SFTP_USERNAME: ${{ secrets.FALIX_SFTP_USERNAME }}
          FALIX_SFTP_PASSWORD: ${{ secrets.FALIX_SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          exec > >(tee /tmp/falix.log) 2>&1
          for variable in FALIX_SFTP_HOST FALIX_SFTP_PORT FALIX_SFTP_USERNAME FALIX_SFTP_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "::error title=Missing FalixNodes secret::${variable} is not configured."
              exit 1
            fi
          done
          if ! [[ "$FALIX_SFTP_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid FalixNodes secret::FALIX_SFTP_PORT must be numeric."
            exit 1
          fi

          SFTP_HOST="${FALIX_SFTP_HOST#sftp://}"
          SFTP_HOST="${SFTP_HOST%%/*}"
          SFTP_HOST="${SFTP_HOST%%:*}"
          if [ -z "$SFTP_HOST" ]; then
            echo "::error title=Invalid FalixNodes secret::FALIX_SFTP_HOST does not contain a host name."
            exit 1
          fi

          sudo apt-get update -qq
          sudo apt-get install --yes --quiet sshpass
          JAR=$(find paper-plugin/build/libs -name 'MrCrayfishVehiclePlugin-*.jar' -type f | head -1)
          CONFIG="paper-plugin/src/main/resources/config.yml"
          export SSHPASS="$FALIX_SFTP_PASSWORD"

          # Supply the vehicle pack once, during login, through server.properties.
          # The plugin detects the same URL and skips its delayed post-join send.
          sshpass -e sftp \
            -oBatchMode=no \
            -oPreferredAuthentications=password \
            -oPubkeyAuthentication=no \
            -oStrictHostKeyChecking=accept-new \
            -oConnectTimeout=20 \
            -P "$FALIX_SFTP_PORT" \
            "${FALIX_SFTP_USERNAME}@${SFTP_HOST}" <<EOF
          get server.properties /tmp/falix-server.properties
          EOF
          test -s /tmp/falix-server.properties
          python3 tools/configure_server_resource_pack.py \
            --server-properties /tmp/falix-server.properties \
            --plugin-config "$CONFIG" \
            --output /tmp/falix-server.properties.updated
          if cmp -s /tmp/falix-server.properties /tmp/falix-server.properties.updated; then
            echo "FalixNodes login-time resource pack is already synchronized."
          else
            sshpass -e sftp \
              -oBatchMode=no \
              -oPreferredAuthentications=password \
              -oPubkeyAuthentication=no \
              -oStrictHostKeyChecking=accept-new \
              -oConnectTimeout=20 \
              -P "$FALIX_SFTP_PORT" \
              "${FALIX_SFTP_USERNAME}@${SFTP_HOST}" <<EOF
            put /tmp/falix-server.properties server.properties.mcv-backup-$GITHUB_RUN_ID
            -rm server.properties.uploading
            put /tmp/falix-server.properties.updated server.properties.uploading
            -rm server.properties
            rename server.properties.uploading server.properties
            ls -l server.properties
          EOF
            echo "FalixNodes login-time resource pack synchronized; original settings backed up."
          fi

          sshpass -e sftp \
            -oBatchMode=no \
            -oPreferredAuthentications=password \
            -oPubkeyAuthentication=no \
            -oStrictHostKeyChecking=accept-new \
            -oConnectTimeout=20 \
            -P "$FALIX_SFTP_PORT" \
            "${FALIX_SFTP_USERNAME}@${SFTP_HOST}" <<EOF
          -mkdir plugins
          -rm plugins/MrCrayfishVehiclePlugin.jar.uploading
          put "$JAR" plugins/MrCrayfishVehiclePlugin.jar.uploading
          -rm plugins/MrCrayfishVehiclePlugin.jar
          -rm plugins/MrCrayfishVehiclePlugin-0.1.0-SNAPSHOT.jar
          rename plugins/MrCrayfishVehiclePlugin.jar.uploading plugins/MrCrayfishVehiclePlugin.jar
          -mkdir plugins/MrCrayfishVehiclePlugin
          put "$CONFIG" plugins/MrCrayfishVehiclePlugin/config.yml.uploading
          -rm plugins/MrCrayfishVehiclePlugin/config.yml
          rename plugins/MrCrayfishVehiclePlugin/config.yml.uploading plugins/MrCrayfishVehiclePlugin/config.yml
          ls -l plugins/MrCrayfishVehiclePlugin.jar
          ls -l plugins/MrCrayfishVehiclePlugin/config.yml
          EOF
          unset SSHPASS FALIX_SFTP_PASSWORD
          echo "FalixNodes plugin upload completed from repository secrets."

      - name: Raporteaza deploy-ul Falix pe commit
        if: always() && hashFiles('.github/falix-deploy-request') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "### Deploy Falix"
            echo ""
            echo '```'
            tail -n 60 /tmp/falix.log 2>/dev/null || echo "nu exista transcript"
            echo '```'
          } > /tmp/falix-summary.md
          head -c 60000 /tmp/falix-summary.md > /tmp/falix-summary-cut.md
          gh api --method POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@/tmp/falix-summary-cut.md

      # Falix "Git" integration nu ruleaza Gradle: trage fisierele din repo si le
      # asaza pe server. Deci JAR-ul trebuie sa existe in branch la plugins/.
      - name: Publica JAR-ul in branch pentru deploy-ul Git din Falix
        if: success() && github.ref == 'refs/heads/arena/2f9f7b9e-mrcrayfishvehiclemod'
        run: |
          set -euo pipefail
          JAR=$(find paper-plugin/build/libs -name 'MrCrayfishVehiclePlugin-*.jar' -type f | grep -v sources | head -1)
          mkdir -p plugins
          cp "$JAR" plugins/MrCrayfishVehiclePlugin.jar
          git add plugins/MrCrayfishVehiclePlugin.jar
          if git diff --cached --quiet -- plugins/MrCrayfishVehiclePlugin.jar; then
            echo "JAR-ul din branch este deja la zi."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deploy: JAR Paper $(date -u +%Y-%m-%dT%H:%MZ) (sha ${GITHUB_SHA:0:7})"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload deliverables
        uses: actions/upload-artifact@v5
        with:
          name: MrCrayfishVehiclePlugin
          if-no-files-found: error
          path: |
            paper-plugin/build/libs/MrCrayfishVehiclePlugin-*.jar
            paper-plugin/build/MrCrayfishVehiclePlugin-resource-pack-26.3-r39.zip

      - name: Public pluginul si pack-ul in release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAPER_API: ${{ inputs.paperApi || '26.3.build.259-stable' }}
        run: |
          set -euo pipefail
          TAG=paper-plugin
          MC_VERSION="${PAPER_API%%.build*}"
          MC_VERSION="${MC_VERSION%%-*}"
          JAR=$(ls paper-plugin/build/libs/*.jar | grep -v -- "-sources" | head -1)
          PACK=$(ls paper-plugin/build/*resource-pack*.zip | head -1)
          OUT="/tmp/MrCrayfishVehiclePlugin-${MC_VERSION}.jar"
          cp "$JAR" "$OUT"
          echo "JAR=$OUT (MC $MC_VERSION)  PACK=$PACK"
          ls -lh "$OUT" "$PACK"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Plugin Paper (masini)" --notes "JAR pe versiuni de Minecraft + resource pack, construite de CI din paper-plugin/."
          fi
          gh release upload "$TAG" "$OUT" "$PACK" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'

  probe:
    if: inputs.probe == true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java ${{ inputs.javaVersion }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.javaVersion }}

      - uses: gradle/actions/setup-gradle@v5

      - name: Compile against ${{ inputs.paperApi }}
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          ./paper-plugin/gradlew -p paper-plugin --no-daemon \
            -PpaperApi="${{ inputs.paperApi }}" \
            -PjavaVersion="${{ inputs.javaVersion }}" \
            compileJava 2>&1 | tee /tmp/compile.log | tail -n 120
          exit "${PIPESTATUS[0]}"

      - name: Publica rezultatul ca comentariu pe commit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "### Probe port ${{ inputs.paperApi }} (Java ${{ inputs.javaVersion }})"
            echo ""
            echo "Rezultat: **${{ steps.compile.outcome }}**"
            echo ""
            if [ "${{ steps.compile.outcome }}" != "success" ]; then
              echo "Erori: $(grep -c '^e: ' /tmp/compile.log || true)"
              echo ""
              echo '```'
              grep '^e: ' /tmp/compile.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -n 80 || tail -n 80 /tmp/compile.log
              echo '```'
            else
              echo "Compileaza curat pe aceasta versiune de API."
            fi
          } > /tmp/summary.md
          head -c 60000 /tmp/summary.md > /tmp/summary_cut.md
          gh api --method POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@/tmp/summary_cut.md

  sftp-upload:
    if: inputs.mode == 'sftp'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Urca JAR-ul din branch pe server
        env:
          SFTP_HOST: ${{ inputs.sftpHost }}
          SFTP_PORT: ${{ inputs.sftpPort }}
          SFTP_USER: ${{ inputs.sftpUser }}
          SFTP_PASSWORD: ${{ inputs.sftpPassword }}
          SFTP_TARGET: ${{ inputs.sftpTarget }}
        run: |
          set -euo pipefail
          exec > >(tee /tmp/sftp.log) 2>&1
          echo "::add-mask::$SFTP_PASSWORD"
          test -s plugins/MrCrayfishVehiclePlugin.jar || { echo "::error title=Lipsa JAR::plugins/MrCrayfishVehiclePlugin.jar nu exista in branch."; exit 1; }
          echo "Local: $(ls -l plugins/MrCrayfishVehiclePlugin.jar | awk '{print $5}') bytes, sha256 $(sha256sum plugins/MrCrayfishVehiclePlugin.jar | cut -d' ' -f1)"
          sudo apt-get update -qq
          sudo apt-get install --yes --quiet sshpass
          export SSHPASS="$SFTP_PASSWORD"
          {
          sshpass -e sftp -oBatchMode=no -oPreferredAuthentications=password -oPubkeyAuthentication=no             -oStrictHostKeyChecking=accept-new -oConnectTimeout=25 -P "$SFTP_PORT" "$SFTP_USER@$SFTP_HOST" <<EOF
          -mkdir $SFTP_TARGET
          -rm $SFTP_TARGET/MrCrayfishVehiclePlugin.jar.uploading
          put plugins/MrCrayfishVehiclePlugin.jar $SFTP_TARGET/MrCrayfishVehiclePlugin.jar.uploading
          -rm $SFTP_TARGET/MrCrayfishVehiclePlugin.jar
          rename $SFTP_TARGET/MrCrayfishVehiclePlugin.jar.uploading $SFTP_TARGET/MrCrayfishVehiclePlugin.jar
          ls -l $SFTP_TARGET
          -get logs/latest.log /tmp/latest.log
          EOF
          } 2>&1

      - name: Restart automat prin API-ul panelului
        if: inputs.panelApiKey != ''
        env:
          PANEL_URL: ${{ inputs.panelUrl }}
          PANEL_ID: ${{ inputs.panelServerId }}
          PANEL_KEY: ${{ inputs.panelApiKey }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PANEL_KEY"
          BASE="${PANEL_URL%/}/api/client/servers/${PANEL_ID}"
          echo "Cer restart la $BASE"
          curl --fail --silent --show-error -X POST "$BASE/power" \
            --header "Authorization: Bearer $PANEL_KEY" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            --data '{"signal":"restart"}' -w '\nHTTP %{http_code}\n'
          sleep 45
          for i in 1 2 3 4 5 6; do
            STATE=$(curl --silent --show-error "$BASE/resources" \
              --header "Authorization: Bearer $PANEL_KEY" \
              --header "Accept: application/json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["attributes"]["current_state"])' 2>/dev/null || echo "?")
            echo "stare: $STATE"
            [ "$STATE" = "running" ] && break
            sleep 10
          done

      - name: Raporteaza rezultatul pe commit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "### SFTP upload ${{ inputs.sftpHost }}"
            echo ""
            echo '```'
            tail -n 25 /tmp/sftp.log 2>/dev/null || echo "fara log"
            echo '```'
            if [ -f /tmp/latest.log ]; then
              echo ""
              echo "#### latest.log (ultimele linii)"
              echo '```'
              tail -n 12 /tmp/latest.log
              echo '```'
              echo ""
              echo "#### plugin si erori"
              echo '```'
              grep -Ei "mrcrayfish|vehicle|ERROR|SEVERE|Exception|Caused by" /tmp/latest.log | tail -n 40
              echo '```'
            fi
          } > /tmp/up.md
          head -c 60000 /tmp/up.md > /tmp/up_cut.md
          gh api --method POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@/tmp/up_cut.md || true

  api-probe:
    if: inputs.mode == 'api-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Autentificare Falix (OIDC)
        run: |
          set -euo pipefail
          ID_TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://client.falixnodes.net/api/v2" | jq -r .value)
          T=$(curl -sSf https://client.falixnodes.net/api/v2/oauth2/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:id_token \
            -d connection=reg_wi7EZ1pUXUnMZf84wbLEk5MBZh \
            --data-urlencode subject_token="$ID_TOKEN" | jq -r .access_token)
          echo "::add-mask::$T"
          echo "FALIX_TOKEN=$T" >> "$GITHUB_ENV"

      - name: Diagnostic complet
        env:
          DO_DEPLOY: ${{ inputs.doDeploy }}
        run: |
          API=https://client.falixnodes.net/api/v2/servers/3500167
          AUTH=(-H "Authorization: Bearer $FALIX_TOKEN" -H "Content-Type: application/json" -H "Accept: application/json")
          URL="https://github.com/ExMarius/MrCrayfishVehicleMod/releases/download/paper-plugin/MrCrayfishVehiclePlugin-resource-pack-26.3-r39.zip"
          SHA1="e8073afc2dfb546eade0ac89f16528253eb84f34"
          exec > >(tee /tmp/diag.log) 2>&1

          echo "== 1. properties inainte"
          curl -s --max-time 20 "$API/properties" "${AUTH[@]}" | tr '}' '\n' | grep -i "resource-pack" || echo "(gol)"

          echo "== 2. scriu resource-pack"
          for BODY in \
            "{\"properties\":{\"resource-pack\":\"$URL\",\"resource-pack-sha1\":\"$SHA1\",\"require-resource-pack\":\"true\"}}" \
            "{\"properties\":[{\"key\":\"resource-pack\",\"value\":\"$URL\"},{\"key\":\"resource-pack-sha1\",\"value\":\"$SHA1\"},{\"key\":\"require-resource-pack\",\"value\":\"true\"}]}" \
            "{\"resource-pack\":\"$URL\",\"resource-pack-sha1\":\"$SHA1\",\"require-resource-pack\":\"true\"}"; do
            C=$(curl -s -o /tmp/pr -w '%{http_code}' --max-time 30 -X PUT "$API/properties" "${AUTH[@]}" -d "$BODY")
            echo "PUT -> $C $(head -c 200 /tmp/pr)"
            case "$C" in 200|201|202|204) break;; esac
          done

          echo "== 3. properties dupa"
          curl -s --max-time 20 "$API/properties" "${AUTH[@]}" | tr '}' '\n' | grep -i "resource-pack" || echo "(gol)"

          echo "== 4. jar pe server"
          curl -s --max-time 20 "$API/files?directory=/plugins" "${AUTH[@]}" | tr '}' '\n' | grep -i "MrCrayfishVehiclePlugin.jar" || echo "(lipsa)"

          echo "== 5. stare"
          curl -s --max-time 20 "$API/console/status" "${AUTH[@]}" | head -c 300; echo

          if [ "${DO_DEPLOY:-true}" = "true" ]; then
            echo "== 6. deploy"
            BODY="{\"url\":\"https://github.com/ExMarius/MrCrayfishVehicleMod/releases/download/paper-plugin/MrCrayfishVehiclePlugin-26.3.jar\",\"directory\":\"/plugins\",\"file_name\":\"MrCrayfishVehiclePlugin.jar\"}"
            echo "pull -> $(curl -s -o /tmp/pull -w '%{http_code}' --max-time 60 -X POST "$API/files/pull" "${AUTH[@]}" -d "$BODY")"
            sleep 10
            echo "== 7. restart"
            C=$(curl -s -o /tmp/power -w '%{http_code}' --max-time 30 -X POST "$API/power" "${AUTH[@]}" -d '{"signal":"restart"}')
            echo "restart -> $C $(head -c 300 /tmp/power)"
            sleep 40
            curl -s --max-time 20 "$API/console/status" "${AUTH[@]}" | head -c 200; echo
          fi

          echo "== 8. log (ultimele 60)"
          curl -s --max-time 20 "$API/console/log?lines=60" "${AUTH[@]}" \
            | python3 -c 'import json,sys;print("\n".join(json.load(sys.stdin).get("data",{}).get("lines",[])))' 2>/dev/null | tail -12

      - name: Publica raportul
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo "### Diagnostic Falix"; echo '```'; tail -n 70 /tmp/diag.log 2>/dev/null || echo "(fara log)"; echo '```'; } > /tmp/rep.md
          head -c 60000 /tmp/rep.md > /tmp/rep_cut.md
          gh api --method POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/rep_cut.md || true

  falix-deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/2f9f7b9e-mrcrayfishvehiclemod'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Autentificare Falix (OIDC)
        run: |
          set -euo pipefail
          ID_TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://client.falixnodes.net/api/v2" | jq -r .value)
          T=$(curl -sSf https://client.falixnodes.net/api/v2/oauth2/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:id_token \
            -d connection=reg_wi7EZ1pUXUnMZf84wbLEk5MBZh \
            --data-urlencode subject_token="$ID_TOKEN" | jq -r .access_token)
          echo "::add-mask::$T"
          echo "FALIX_TOKEN=$T" >> "$GITHUB_ENV"

      - name: Sincronizeaza JAR-ul si resource-pack-ul
        run: |
          API=https://client.falixnodes.net/api/v2/servers/3500167
          AUTH=(-H "Authorization: Bearer $FALIX_TOKEN" -H "Content-Type: application/json" -H "Accept: application/json")
          JAR="https://github.com/ExMarius/MrCrayfishVehicleMod/releases/download/paper-plugin/MrCrayfishVehiclePlugin-26.3.jar"
          PACK="https://github.com/ExMarius/MrCrayfishVehicleMod/releases/download/paper-plugin/MrCrayfishVehiclePlugin-resource-pack-26.3-r39.zip"
          SHA1="e8073afc2dfb546eade0ac89f16528253eb84f34"
          exec > >(tee /tmp/deploy.log) 2>&1
          echo "== properties:"
          for B in \
            "{\"properties\":[{\"key\":\"resource-pack\",\"value\":\"$PACK\"},{\"key\":\"resource-pack-sha1\",\"value\":\"$SHA1\"},{\"key\":\"require-resource-pack\",\"value\":\"true\"}]}" \
            "{\"properties\":{\"resource-pack\":\"$PACK\",\"resource-pack-sha1\":\"$SHA1\",\"require-resource-pack\":\"true\"}}"; do
            C=$(curl -s -o /tmp/pr -w '%{http_code}' --max-time 30 -X PUT "$API/properties" "${AUTH[@]}" -d "$B")
            echo "PUT -> $C $(head -c 160 /tmp/pr)"
            case "$C" in 200|201|202|204) break;; esac
          done
          curl -s --max-time 20 "$API/properties" "${AUTH[@]}" | tr '}' '\n' | grep -i "resource-pack" || echo "(gol)"
          echo "== pull jar:"
          B="{\"url\":\"$JAR\",\"directory\":\"/plugins\",\"file_name\":\"MrCrayfishVehiclePlugin.jar\"}"
          echo "pull -> $(curl -s -o /tmp/pull -w '%{http_code}' --max-time 60 -X POST "$API/files/pull" "${AUTH[@]}" -d "$B")"
          sleep 12
          curl -s --max-time 20 "$API/files?directory=/plugins" "${AUTH[@]}" | tr '}' '\n' | grep -i "MrCrayfishVehiclePlugin.jar" || echo "(lipsa)"
          echo "== restart:"
          C=$(curl -s -o /tmp/power -w '%{http_code}' --max-time 30 -X POST "$API/power" "${AUTH[@]}" -d '{"signal":"restart"}')
          echo "restart -> $C $(head -c 300 /tmp/power)"
          if [ "$C" = "403" ]; then
            python3 -c 'import json;d=json.load(open("/tmp/power"));print("LINK_VERIFICARE:",(d.get("error") or {}).get("action_url"))' || true
          fi

      - name: Raport pe commit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API=https://client.falixnodes.net/api/v2/servers/3500167
          AUTH=(-H "Authorization: Bearer $FALIX_TOKEN" -H "Accept: application/json")
          { echo "### Deploy automat Falix"
            echo ""
            echo "commit: \`${GITHUB_SHA:0:7}\`"
            echo '```'
            tail -n 30 /tmp/deploy.log 2>/dev/null || echo "(fara log de deploy)"
            echo '---'
            curl -s --max-time 20 "$API/console/log?lines=120" "${AUTH[@]}" \
              | python3 -c 'import json,sys;print("\n".join(json.load(sys.stdin).get("data",{}).get("lines",[])))' 2>/dev/null \
              | grep -Ei "Vehicle plugin enabled|MrCrayfishVehiclePlugin\]|ERROR|SEVERE|Exception" | tail -n 12 || true
            echo '```'
          } > /tmp/rep.md
          head -c 60000 /tmp/rep.md > /tmp/rep_cut.md
          gh api --method POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/rep_cut.md || true
