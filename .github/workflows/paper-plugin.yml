name: Paper plugin

on:
  push:
    paths:
      - "paper-plugin/**"
      - "tools/build_resource_pack.py"
      - "src/main/resources/assets/vehicle/**"
      - "src/main/resources/vehicle_mod.png"
      - ".github/workflows/paper-plugin.yml"
  pull_request:
    paths:
      - "paper-plugin/**"
      - "tools/build_resource_pack.py"
      - "src/main/resources/assets/vehicle/**"
      - "src/main/resources/vehicle_mod.png"
      - ".github/workflows/paper-plugin.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build plugin and resource pack
        run: ./paper-plugin/gradlew -p paper-plugin clean build resourcePack

      - name: Verify resource pack
        run: |
          unzip -t paper-plugin/build/MrCrayfishVehiclePlugin-resource-pack.zip
          sha1sum paper-plugin/build/MrCrayfishVehiclePlugin-resource-pack.zip

      - name: Publish prototype release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="vehicle-plugin-prototype-v0.1.0"
          JAR=$(find paper-plugin/build/libs -name 'MrCrayfishVehiclePlugin-*.jar' -type f | head -1)
          PACK="paper-plugin/build/MrCrayfishVehiclePlugin-resource-pack.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" "$PACK" --clobber
          else
            gh release create "$TAG" "$JAR" "$PACK" \
              --target "$GITHUB_SHA" \
              --title "Vehicle Plugin Go Kart prototype v0.1.0" \
              --notes "First server-side Go Kart prototype for Paper 26.2. Requires the attached resource pack." \
              --prerelease
          fi

      - name: Upload deliverables
        uses: actions/upload-artifact@v5
        with:
          name: MrCrayfishVehiclePlugin
          if-no-files-found: error
          path: |
            paper-plugin/build/libs/MrCrayfishVehiclePlugin-*.jar
            paper-plugin/build/MrCrayfishVehiclePlugin-resource-pack.zip
