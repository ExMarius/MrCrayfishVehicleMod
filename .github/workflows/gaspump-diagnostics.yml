name: Gas pump diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - arena/339da537-mrcrayfishvehiclemod
    paths:
      - .github/workflows/gaspump-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect:
    name: Dump every live gas pump (including active nozzle/hose, if held)
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Send '/vehicle pump debug' to the console and report the result
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/minecraft-server/mc"

          if ! screen -list 2>/dev/null | grep -q '[.]mcv-minecraft[[:space:]]'; then
            echo "::notice title=Gas pump diagnostics::mcv-minecraft screen session not running"
            exit 0
          fi

          before=$(wc -l < "$ROOT/logs/latest.log" 2>/dev/null || echo 0)
          screen -S mcv-minecraft -X stuff 'vehicle pump debug\n'
          sleep 3
          tail -n +"$((before + 1))" "$ROOT/logs/latest.log" > /tmp/pump_debug_raw.log || true
          sed -E 's/^\[[0-9:]+\] \[[^]]+\]: \[MrCrayfishVehiclePlugin\] //' /tmp/pump_debug_raw.log \
            > /tmp/pump_debug.log

          if ! grep -q "stored pump:" /tmp/pump_debug.log; then
            echo "::notice title=Gas pump diagnostics::No pump debug output captured (is anyone holding a nozzle?)"
            exit 0
          fi

          awk '
            function flush() {
              if (block == "") return;
              gsub(/%/, "%25", block);
              gsub(/\r/, "%0D", block);
              gsub(/\n/, "%0A", block);
              n++;
              printf "::notice title=Pump dump %d::%s\n", n, block;
            }
            /^stored pump:/ { flush(); block = "" }
            { block = block $0 "\n" }
            END { flush() }
          ' /tmp/pump_debug.log
