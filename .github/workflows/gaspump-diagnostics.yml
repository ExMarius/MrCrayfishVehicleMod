name: Gas pump diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - arena/339da537-mrcrayfishvehiclemod
    paths:
      - .github/workflows/gaspump-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect:
    name: Clear all registered gas pumps (pre-facing-fix leftovers)
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Send '/vehicle pump clear' to the console and report the result
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/minecraft-server/mc"

          if ! screen -list 2>/dev/null | grep -q '[.]mcv-minecraft[[:space:]]'; then
            echo "::notice title=Gas pump diagnostics::mcv-minecraft screen session not running"
            exit 0
          fi

          before=$(wc -l < "$ROOT/logs/latest.log" 2>/dev/null || echo 0)
          screen -S mcv-minecraft -X stuff 'vehicle pump clear\n'
          sleep 3
          tail -n +"$((before + 1))" "$ROOT/logs/latest.log" > /tmp/pump_clear_raw.log || true
          sed -E 's/^\[[0-9:]+\] \[[^]]+\]: \[MrCrayfishVehiclePlugin\] //' /tmp/pump_clear_raw.log \
            > /tmp/pump_clear.log

          result=$(cat /tmp/pump_clear.log)
          escaped="${result//'%'/'%25'}"; escaped="${escaped//$'\r'/'%0D'}"; escaped="${escaped//$'\n'/'%0A'}"
          echo "::notice title=Pump clear result::${escaped:-<no console output captured>}"
