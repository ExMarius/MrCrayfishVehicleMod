name: Gas pump diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - arena/339da537-mrcrayfishvehiclemod
    paths:
      - .github/workflows/gaspump-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect:
    name: Dump registered gas pumps straight from the live server
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Report pump store and live rig dump
        shell: bash
        run: |
          set -euo pipefail
          notice() {
            local value="$1"
            value="${value//'%'/'%25'}"; value="${value//$'\r'/'%0D'}"; value="${value//$'\n'/'%0A'}"
            echo "::notice title=Gas pump diagnostics::$value"
          }
          ROOT="$HOME/minecraft-server/mc"
          PUMPS="$ROOT/plugins/MrCrayfishVehiclePlugin/gaspumps.yml"

          if [ -s "$PUMPS" ]; then
            notice "gaspumps.yml contents:\n$(cat "$PUMPS")"
          else
            notice "gaspumps.yml not found or empty at $PUMPS"
          fi

          if screen -list 2>/dev/null | grep -q '[.]mcv-minecraft[[:space:]]'; then
            before=$(wc -l < "$ROOT/logs/latest.log" 2>/dev/null || echo 0)
            screen -S mcv-minecraft -X stuff 'vehicle pump debug\n'
            sleep 3
            after_text=$(tail -n +"$((before + 1))" "$ROOT/logs/latest.log" 2>/dev/null || true)
            notice "console '/vehicle pump debug' output:\n${after_text:-<no new log lines>}"
          else
            notice "mcv-minecraft screen session not running; cannot dispatch console command"
          fi
