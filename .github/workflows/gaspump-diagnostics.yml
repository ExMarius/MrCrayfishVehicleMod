name: Gas pump diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - arena/339da537-mrcrayfishvehiclemod
    paths:
      - .github/workflows/gaspump-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect:
    name: Dump registered gas pumps straight from the live server
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Collect and report live rig dump, one pump per notice
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/minecraft-server/mc"

          if ! screen -list 2>/dev/null | grep -q '[.]mcv-minecraft[[:space:]]'; then
            echo "::notice title=Gas pump diagnostics::mcv-minecraft screen session not running"
            exit 0
          fi

          before=$(wc -l < "$ROOT/logs/latest.log" 2>/dev/null || echo 0)
          screen -S mcv-minecraft -X stuff 'vehicle pump debug\n'
          sleep 3
          tail -n +"$((before + 1))" "$ROOT/logs/latest.log" > /tmp/pump_debug_raw.log || true

          # Strip the leading Minecraft log timestamp/thread prefix the console tacks onto
          # only the very first line of the plugin's multi-line info() call.
          sed -E 's/^\[[0-9:]+\] \[[^]]+\]: \[MrCrayfishVehiclePlugin\] //' /tmp/pump_debug_raw.log \
            > /tmp/pump_debug.log

          python3 - <<'PY'
          from pathlib import Path
          text = Path("/tmp/pump_debug.log").read_text()
          blocks = [b.strip() for b in text.split("\n\n") if b.strip()]
          if not blocks:
              print("::notice title=Gas pump diagnostics::no console output captured")
          for i, block in enumerate(blocks, 1):
              escaped = block.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title=Pump dump {i}::{escaped}")
          PY
