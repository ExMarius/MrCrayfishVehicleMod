name: Gas pump diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - arena/339da537-mrcrayfishvehiclemod
    paths:
      - .github/workflows/gaspump-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect:
    name: Dump registered gas pumps straight from the live server
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Collect pump store and live rig dump
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/minecraft-server/mc"
          PUMPS="$ROOT/plugins/MrCrayfishVehiclePlugin/gaspumps.yml"
          OUT="$PWD/gaspump-diagnostics.txt"

          {
            echo "=== gaspumps.yml ==="
            if [ -s "$PUMPS" ]; then
              cat "$PUMPS"
            else
              echo "(not found or empty at $PUMPS)"
            fi
            echo
            echo "=== console '/vehicle pump debug' output ==="
          } > "$OUT"

          if screen -list 2>/dev/null | grep -q '[.]mcv-minecraft[[:space:]]'; then
            before=$(wc -l < "$ROOT/logs/latest.log" 2>/dev/null || echo 0)
            screen -S mcv-minecraft -X stuff 'vehicle pump debug\n'
            sleep 3
            tail -n +"$((before + 1))" "$ROOT/logs/latest.log" 2>/dev/null >> "$OUT" || true
          else
            echo "(mcv-minecraft screen session not running)" >> "$OUT"
          fi

          cat "$OUT"

      - name: Upload full dump as artifact
        uses: actions/upload-artifact@v5
        with:
          name: gaspump-diagnostics
          path: gaspump-diagnostics.txt
          retention-days: 1
