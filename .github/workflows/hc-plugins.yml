name: HidenCloud plugins (stack de baza + TAB/scoreboard UKEMC)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/2f9f7b9e-mrcrayfishvehiclemod
    paths:
      - ".github/workflows/hc-plugins.yml"
      - "hidencloud/**"

permissions:
  contents: read

concurrency:
  group: hc-plugins
  cancel-in-progress: false

env:
  PANEL: https://freepanel.hidencloud.com
  SERVER_ID: a4e04808
  MC_VERSION: "1.21.4"

jobs:
  plugins:
    name: Descarc pluginurile, le încarc pe server, restart
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Doar dacă secretul există
        id: guard
        env:
          HIDENCLOUD_API_KEY: ${{ secrets.HIDENCLOUD_API_KEY }}
        run: |
          if [ -z "${HIDENCLOUD_API_KEY:-}" ]; then
            echo "::error title=HIDENCLOUD::lipsește secretul HIDENCLOUD_API_KEY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else echo "enabled=true" >> "$GITHUB_OUTPUT"; fi

      - name: Ce am deja pe server (plugins/)
        if: steps.guard.outputs.enabled == 'true'
        env:
          K3Y: ${{ secrets.HIDENCLOUD_API_KEY }}
        run: |
          L=$(curl -fsS -m 15 -H "Authorization: Bearer $K3Y" -H 'Accept: application/json' \
               "$PANEL/api/client/servers/$SERVER_ID/files/list?directory=%2Fplugins") || L='{"data":[]}'
          NAMES=$(echo "$L" | jq -r '[.data[].attributes.name] | join(", ")')
          echo "plugins actuale: $NAMES"
          echo "::notice title=HC-PLUGINS-INAINTE::${NAMES:-(directorul plugins e gol/afara)}"

      - name: Descarc JAR-urile (surse oficiale)
        id: dl
        if: steps.guard.outputs.enabled == 'true'
        run: |
          mkdir -p stage/plugins
          SKIPPED=""

          # EssentialsX (core + Chat + Spawn), ultimul build stabil CI oficial
          EJ=$(curl -fsS -m 30 "https://ci.ender.zone/job/EssentialsX/lastStableBuild/api/json" 2>/dev/null)
          echo "$EJ" | jq -r '.artifacts[].relativePath' | grep -E '^jars/EssentialsX(Chat|Spawn)?-[0-9][^/]*\.jar$' | while read -r rel; do
            curl -fsSL -m 90 -o "stage/plugins/$(basename "$rel")" "https://ci.ender.zone/job/EssentialsX/lastStableBuild/artifact/$rel" || true
          done
          ls stage/plugins/ | grep -q '^EssentialsX-' || SKIPPED="$SKIPPED EssentialsX(fail-ci)"

          # Vault (GitHub releases Milkbowl/Vault — asset numit Vault*.jar)
          for attempt in 1 2 3; do
            VJ=$(curl -fsSL --retry 2 -m 30 "https://api.github.com/repos/Milkbowl/Vault/releases/latest" \
                  | jq -r '[.assets[] | select(.name | startswith("Vault") and endswith(".jar"))] | .[0].browser_download_url // ""')
            [ -n "$VJ" ] && break
            sleep 4
          done
          [ -n "$VJ" ] && curl -fsSL --retry 2 -m 60 -o stage/plugins/Vault.jar "$VJ" || SKIPPED="$SKIPPED Vault"
          [ -s stage/plugins/Vault.jar ] || SKIPPED="$SKIPPED Vault(dl)"

          # LuckPerms (Modrinth, paper — ultima versiune; 6.x suportă 8.x–1.21.x)
          LP=$(curl -fsS -m 30 "https://api.modrinth.com/v2/project/luckperms/version?loaders=%5B%22paper%22%5D" \
                | jq -r '.[0].files[] | select(.primary==true) | .url' | head -1)
          [ -n "$LP" ] && curl -fsSL -m 120 -o "stage/plugins/LuckPerms-Bukkit.jar" "$LP" || SKIPPED="$SKIPPED LuckPerms"
          [ -s stage/plugins/LuckPerms-Bukkit.jar ] || SKIPPED="$SKIPPED LuckPerms(dl)"

          # WorldEdit (Modrinth, 1.21.4 / paper)
          WE=$(curl -fsS -m 30 "https://api.modrinth.com/v2/project/worldedit/version?loaders=%5B%22paper%22%5D&game_versions=%5B%22$MC_VERSION%22%5D" \
                | jq -r '.[0].files[] | select(.primary==true) | .url' | head -1)
          [ -n "$WE" ] && curl -fsSL -m 120 -o "stage/plugins/worldedit-bukkit.jar" "$WE" || SKIPPED="$SKIPPED WorldEdit"
          [ -s stage/plugins/worldedit-bukkit.jar ] || SKIPPED="$SKIPPED WorldEdit(dl)"

          # TAB (GitHub releases NEZNAMY/TAB — asset .jar)
          TBJ=$(curl -fsSL --retry 3 -m 30 "https://api.github.com/repos/NEZNAMY/TAB/releases/latest" \
                 | jq -r '[.assets[] | select(.name | test("^[Tt][Aa][Bb].*\\.jar$"))] | .[0].browser_download_url // ""')
          [ -n "$TBJ" ] && curl -fsSL --retry 3 -m 120 -o "stage/plugins/TAB.jar" "$TBJ" || SKIPPED="$SKIPPED TAB"
          [ -s stage/plugins/TAB.jar ] || SKIPPED="$SKIPPED TAB(dl)"

          ls -lh stage/plugins/ | tail -n +2
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          if [ -n "$SKIPPED" ]; then
            echo "::error title=PL-DOWNLOAD::nereușite: $SKIPPED (verifică sursele)"
            exit 1
          fi
          COUNT=$(find stage/plugins -name '*.jar' | wc -l)
          echo "::notice title=PL-DOWNLOAD::descărcate $COUNT JAR-uri"

      - name: Copiez config-urile din repo (TAB, Essentials motd)
        if: steps.guard.outputs.enabled == 'true'
        run: |
          mkdir -p stage/plugins/TAB stage/plugins/Essentials
          cp hidencloud/config/TAB/config.yml stage/plugins/TAB/config.yml
          cp hidencloud/config/Essentials/motd.txt stage/plugins/Essentials/motd.txt
          echo "configs:"
          find stage -type f | sort

      - name: Bundle + upload + decompress
        if: steps.guard.outputs.enabled == 'true' && steps.dl.outputs.skipped == ''
        env:
          K3Y: ${{ secrets.HIDENCLOUD_API_KEY }}
        run: |
          set -e
          AUTH="Authorization: Bearer $K3Y"
          tar czf bundle.tgz -C stage plugins
          U=""
          for attempt in 1 2 3 4 5 6 7 8; do
            U=$(curl -fsS -m 20 -X GET -H "$AUTH" -H 'Accept: application/json' \
                 "$PANEL/api/client/servers/$SERVER_ID/files/upload" | jq -r '.attributes.url // ""' 2>/dev/null) || true
            [ -n "$U" ] && break
            sleep 5
          done
          [ -n "$U" ] || { echo "::error title=HC-UPLOAD::nu am primit URL de upload (panel flaky)"; exit 1; }
          CODE=$(curl -sS -m 300 -o /tmp/body.txt -w '%{http_code}' --request POST --form files=@bundle.tgz "$U")
          echo "upload: $CODE"
          [ "$CODE" = 204 -o "$CODE" = 200 -o "$CODE" = 201 ] || { echo "::error title=HC-UPLOAD::upload esuat ($CODE) $(head -c 200 /tmp/body.txt | tr '\n' ' ')"; exit 1; }
          D=000
          for attempt in 1 2 3; do
            D=$(curl -sS -m 300 -X POST -H "$AUTH" -H 'Content-Type: application/json' \
                 -d '{"root": "/", "file": "bundle.tgz"}' -o /dev/null -w '%{http_code}' \
                 "$PANEL/api/client/servers/$SERVER_ID/files/decompress") || true
            [ "$D" = 204 ] && break
            sleep 5
          done
          [ "$D" = 204 ] || { echo "::error title=HC-DECOMPRESS::HTTP $D"; exit 1; }
          curl -fsS -m 30 -X POST -H "$AUTH" -H 'Content-Type: application/json' \
               -d '{"root": "/", "files": ["bundle.tgz"]}' -o /dev/null \
               "$PANEL/api/client/servers/$SERVER_ID/files/delete" || true
          echo "::notice title=HC-PLUGINS::jar-uri + configuri aterizate în /plugins (upload $CODE, extract $D)"

      - name: Curăț dublurile TAB (jar-ul vechi cu spații)
        if: steps.guard.outputs.enabled == 'true'
        env:
          K3Y: ${{ secrets.HIDENCLOUD_API_KEY }}
        run: |
          AUTH="Authorization: Bearer $K3Y"
          OLD=$(curl -fsS -m 15 -H "$AUTH" -H 'Accept: application/json' \
                "$PANEL/api/client/servers/$SERVER_ID/files/list?directory=%2Fplugins" \
                | jq -r '[.data[].attributes.name | select(startswith("TAB v") or (test("TAB.*jar$") and . != "TAB.jar"))]')
          N=$(echo "$OLD" | jq length)
          if [ "$N" -gt 0 ]; then
            R=$(curl -fsS -m 30 -X POST -H "$AUTH" -H 'Content-Type: application/json' \
                 -d "{\"root\": \"/plugins\", \"files\": $OLD}" -o /dev/null -w '%{http_code}' \
                 "$PANEL/api/client/servers/$SERVER_ID/files/delete")
            echo "sterse $N fisiere TAB vechi → HTTP $R"
            echo "::notice title=HC-DUPES::am șters dublurile TAB rămase ($N fișiere)"
          else
            echo "nici o dublură TAB"
          fi

      - name: Restart + aștept online
        if: steps.guard.outputs.enabled == 'true'
        env:
          K3Y: ${{ secrets.HIDENCLOUD_API_KEY }}
        run: |
          AUTH="Authorization: Bearer $K3Y"
          curl -fsS -m 30 -X POST -H "$AUTH" -H 'Content-Type: application/json' \
               -d '{"signal":"restart"}' -o /dev/null "$PANEL/api/client/servers/$SERVER_ID/power" || true
          for i in $(seq 1 24); do
            sleep 15
            ST=$(curl -fsS -m 15 -H "$AUTH" -H 'Accept: application/json' "$PANEL/api/client/servers/$SERVER_ID/resources" | jq -r '.attributes.current_state // "?"')
            echo "  [$i] $ST"
            [ "$ST" = running ] && break
          done
          S=$(curl -fsS -m 15 -H "$AUTH" -H 'Accept: application/json' "$PANEL/api/client/servers/$SERVER_ID")
          ADDR=$(echo "$S" | jq -r '.attributes.relationships.allocations.data[]? | select(.attributes.is_default==true) | "\(.attributes.ip_alias // .attributes.ip):\(.attributes.port)"' | head -1)
          echo "::notice title=HC-PLUGINS-DONE::server online ($ST) pe $ADDR — stack instalat"
