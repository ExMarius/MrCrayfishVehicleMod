name: Debug compile
on:
  push:
    branches:
      - arena/2f9f7b9e-mrcrayfishvehiclemod
  workflow_dispatch:

jobs:
  dbg:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: compileJava with annotations
        run: |
          set +e
          ./paper-plugin/gradlew -p paper-plugin compileJava clean --console=plain > /tmp/out.txt 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -E "error:" /tmp/out.txt | head -40 | while read -r line; do
              f=$(echo "$line" | sed 's/:.*//' )
              l=$(echo "$line" | cut -d: -f2)
              msg=$(echo "$line" | cut -d: -f4- | tr -d '\r')
              echo "::error file=${f:-unknown},line=${l:-1}::${msg:-compile-error}"
            done
            echo "=== GRADLE TAIL ==="
            tail -30 /tmp/out.txt | sed 's/%/%%/g;s/\r//g'
            exit $rc
          fi
      - name: compileTestJava with annotations
        run: |
          set +e
          ./paper-plugin/gradlew -p paper-plugin compileTestJava --console=plain > /tmp/out2.txt 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -E "error:" /tmp/out2.txt | head -40 | while read -r line; do
              f=$(echo "$line" | sed 's/:.*//')
              l=$(echo "$line" | cut -d: -f2)
              msg=$(echo "$line" | cut -d: -f4- | tr -d '\r')
              echo "::error file=${f:-unknown},line=${l:-1}::${msg:-compile-error}"
            done
            tail -30 /tmp/out2.txt | sed 's/%/%%/g;s/\r//g'
            exit $rc
          fi
      - name: run tests
        run: |
          set +e
          ./paper-plugin/gradlew -p paper-plugin test --console=plain > /tmp/out3.txt 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            for x in paper-plugin/build/test-results/test/TEST-*.xml; do
              [ -f "$x" ] || continue
              grep -o '<testcase [^>]*>' "$x" | while read -r tc; do :; done
              msg=$(sed -n 's/.*<failure[^>]*>\([^<]*\).*/\1/p' "$x" | head -2 | tr '\n' ' ' | sed 's/[][,")]//g' | cut -c1-900)
              if [ -n "$msg" ]; then
                echo "::error file=tests,line=1:: $(basename "$x") :: $msg"
              fi
            done
            tail -15 /tmp/out3.txt | sed 's/%/%%/g;s/\r//g'
            exit $rc
          fi
