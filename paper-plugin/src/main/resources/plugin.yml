name: MrCrayfishVehiclePlugin
version: '${version}'
main: com.mrcrayfish.vehicle.paper.VehiclePlugin
api-version: '1.21.4'
description: Server-side port of MrCrayfish's Vehicle Mod for vanilla clients.
author: MrCrayfish
contributors: [ExMarius]
website: https://github.com/ExMarius/MrCrayfishVehicleMod
softdepend: [Vault]
commands:
  vehicle:
    description: Manage server-side vehicles.
    usage: /vehicle <spawn|remove|refuel|list|save|pack|pump|fuelprice>
    permission: vehicle.use
    aliases: [veh, car]
permissions:
  vehicle.use:
    description: Allows players to use vehicles.
    default: true
  vehicle.admin:
    description: Allows spawning and removing vehicles, and managing gas pumps.
    default: op
