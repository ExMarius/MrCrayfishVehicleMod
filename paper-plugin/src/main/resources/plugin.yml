name: MrCrayfishVehiclePlugin
version: '${version}'
main: com.mrcrayfish.vehicle.paper.VehiclePlugin
api-version: '1.21.4'
description: Server-side port of MrCrayfish's Vehicle Mod for vanilla clients.
author: MrCrayfish
contributors: [ExMarius]
website: https://github.com/ExMarius/MrCrayfishVehicleMod
commands:
  garaj:
    description: Garajul personal + sechestru (hibrid, depinde de locul unde stai).
    usage: /garaj [set|remove]
    permission: vehicle.use
    aliases: [garage, parcare]
  vehicle:
    description: Manage server-side vehicles.
    usage: /vehicle <spawn|remove|refuel|list|save|pack>
    permission: vehicle.use
    aliases: [veh, car]
permissions:
  vehicle.use:
    description: Allows players to use vehicles.
    default: true
  vehicle.admin:
    description: Allows spawning and removing vehicles.
    default: op
  vehicle.garage:
    description: Allows players to set/remove their personal parking spot (/garaj set|remove). OP bypasses it.
    default: false
  mcv.creative:
    description: Deschide /vehicle creative (meniul complet al sistemului mecanic).
    default: op
  mcv.jack.use:
    description: Folosirea cricului/elevatorului auto.
    default: op
  mcv.workstation.use:
    description: Primirea cheii de mecanic de la bancul de lucru.
    default: op
  mcv.mechanic.engine:
    description: Schimbarea motorului unui vehicul.
    default: op
  mcv.mechanic.wheel:
    description: Schimbarea rotilor unui vehicul.
    default: op
  mcv.mechanic.repair:
    description: Repararea vehiculelor (de pe cric, din iteme).
    default: op
  mcv.mechanic.paint:
    description: Vopsirea vehiculelor cu spray can.
    default: op
  mcv.vehicle.lock:
    description: Inchiderea/deschiderea masinii cu cheia.
    default: op
  mcv.vehicle.dismantle:
    description: Demontarea vehiculului propriu cu ciocanul.
    default: op
  mcv.fluidmixer.use:
    description: Folosirea mixerului de fluide (Blaze Juice + Ender Sap = Fuellium).
    default: op
softdepend: [Vault]
