# Direct HTTPS URL to MrCrayfishVehiclePlugin-resource-pack-1.21.4-r38.zip.
# Leave blank while developing. Players need this pack to see vehicle models and hear vehicle sounds.
resource-pack:
  url: "https://github.com/ExMarius/MrCrayfishVehicleMod/releases/download/vehicle-plugin-prototype-v0.1.0/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r38.zip"
  sha1: "b8c88161893571a898d28dca1666121e9bafcbe1"
  required: true
  prompt: "Acest resource pack este necesar pentru modelele și sunetele vehiculelor."

physics:
  global-speed-limit: 100.0
  fuel-consumption-factor: 1.0

performance:
  # Parked vehicles farther away are serialized and respawn when a player approaches.
  activation-distance: 64.0

persistence:
  autosave-seconds: 300

# Gas pumps are new (not part of the original mod): admins mark a block with
# "/vehicle pump create" and players refuel the nearest vehicle by right-clicking it.
# Paid fuel requires Vault plus any economy plugin that hooks into it (e.g. EssentialsX).
# Without Vault, pumps automatically dispense fuel for free instead of blocking play.
economy:
  # Price per 1% of a vehicle's tank. Live-adjustable with "/vehicle fuelprice <value>".
  fuel-price-per-percent: 1.0
  # How much of the tank fills per second while a player holds a pump active.
  fill-percent-per-second: 10.0
  # Maximum distance (blocks) a player may stray from the pump or the vehicle
  # before fueling stops automatically.
  max-pump-distance: 5.0
