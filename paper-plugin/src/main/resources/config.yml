# Direct HTTPS URL to MrCrayfishVehiclePlugin-resource-pack-1.21.4-r8.zip.
# Leave blank while developing. Players need this pack to see vehicle models and hear vehicle sounds.
resource-pack:
  url: "https://github.com/ExMarius/MrCrayfishVehicleMod/releases/download/vehicle-plugin-prototype-v0.1.0/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r8.zip"
  sha1: "3d709a33ade14fded2fcffc33c658a2187072658"
  required: true
  prompt: "Acest resource pack este necesar pentru modelele și sunetele vehiculelor."

physics:
  global-speed-limit: 100.0
  fuel-consumption-factor: 1.0

performance:
  # Parked vehicles farther away are serialized and respawn when a player approaches.
  activation-distance: 64.0

seating:
  # Source VehicleEntity#clampYaw: torso follows the seat, camera/head remains free.
  lock-body-to-seat: true
  max-head-yaw: 120.0

persistence:
  autosave-seconds: 300
