# Global garage economy (ONE list under garage.<uuid>.*, price decided by location)
economy:
  # Fee charged when taking ANY vehicle out of the global garage at a PUBLIC spot.
  # At the personal spot the same list always leaves for FREE (0$).
  public-garage-retrieval-fee: 500.0
  # Parking spots are PHYSICAL circles of exactly 2 blocks (the spark ring).
  # On quit every owned vehicle is stored, no flags, no differentiation.
