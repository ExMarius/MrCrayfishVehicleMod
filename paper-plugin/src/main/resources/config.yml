# Direct HTTPS URL to MrCrayfishVehiclePlugin-resource-pack-1.21.4-r38.zip.
# Leave blank while developing. Players need this pack to see vehicle models and hear vehicle sounds.
resource-pack:
  url: "https://github.com/ExMarius/MrCrayfishVehicleMod/releases/download/vehicle-plugin-prototype-v0.1.0/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r38.zip"
  sha1: "24626b00feaf1040479179a0a8df00a5510e88fa"
  required: true
  prompt: "Acest resource pack este necesar pentru modelele și sunetele vehiculelor."

physics:
  global-speed-limit: 100.0
  fuel-consumption-factor: 1.0

performance:
  # Parked vehicles farther away are serialized and respawn when a player approaches.
  activation-distance: 64.0

persistence:
  autosave-seconds: 300

# Fuel stations are an admin-only roleplay fixture: an operator looks at a block and runs
# "/vehicle station create" to register it (there is no survival block item). A player then
# right-clicks it to pick up the nozzle, and right-clicks a nearby vehicle to start fueling it.
# Paid fuel requires Vault plus any economy plugin that hooks into it (e.g. EssentialsX); without
# one, stations automatically dispense fuel for free instead of blocking play.
fuel-station:
  # Cost per 1% of a vehicle's tank. Live-adjustable with "/vehicle station price <value>".
  price-per-percent: 1.0
  # How much of the tank fills per second while a player holds a station's nozzle on a vehicle.
  fill-rate-percent-per-second: 12.0
  # Maximum distance (blocks) a player may stray from the station or the vehicle before
  # fueling stops automatically.
  max-distance: 5.0
