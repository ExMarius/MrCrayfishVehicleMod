# Direct HTTPS URL to MrCrayfishVehiclePlugin-resource-pack-1.21.4-r38.zip.
# Leave blank while developing. Players need this pack to see vehicle models and hear vehicle sounds.
resource-pack:
  url: "https://github.com/ExMarius/MrCrayfishVehicleMod/releases/download/vehicle-plugin-prototype-v0.1.0/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r38.zip"
  sha1: "e93439ee85ea8b0e19b0fa78ea1dd540df6a27f4"
  required: true
  prompt: "Acest resource pack este necesar pentru modelele și sunetele vehiculelor."

physics:
  global-speed-limit: 100.0
  fuel-consumption-factor: 1.0

performance:
  # Parked vehicles farther away are serialized and respawn when a player approaches.
  activation-distance: 64.0

gas-pump:
  # How far the nozzle can be carried from its pump before it is automatically put back down.
  max-hose-distance: 10.0
  # Seconds of continuous fueling needed to fill an empty tank. Fuel is free and unlimited;
  # see the gas pump feature notes for why (no vanilla/Paper equivalent to a real fluid tank).
  fill-seconds: 15.0

persistence:
  autosave-seconds: 300
